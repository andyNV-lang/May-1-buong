/* ============================================================
   KẾT QUẢ CHẠY MÁY  (bản 1.6: nằm ngay trên màn hình nhập liệu)
   ============================================================ */

/*
 * Tính lại bảng tỉ lệ NGAY TRÊN MÁY sau khi lưu xong một mẻ bao.
 *
 * Vì sao không hỏi lại máy chủ: lưu một mẻ bao cố ý chỉ tốn ĐÚNG 1 lượt mạng — máy tự
 * chèn bao vừa lưu vào danh sách thay vì tải lại cả lô (xem luuBao). Hỏi thêm lượt nữa
 * chỉ để lấy tỉ lệ là ném đi chính cái lợi đó, mà đường lấy tỉ lệ lại là đường quét cả
 * sheet BAO. Máy đã có sẵn mọi bao của lô trong S.dsBao, đây thuần là phép cộng.
 *
 * ⚠️ CÔNG THỨC Ở ĐÂY PHẢI KHỚP tinhTiLe_ VÀ canhBaoHaoHut_ trong 05_Report.gs:
 * làm tròn 2 số lẻ TỪNG tỉ lệ rồi mới lấy 100 trừ đi — nhờ vậy 4 con số trên màn hình
 * cộng lại đúng 100 và công nhân nhẩm lại được. Sửa một bên mà quên bên kia thì hai
 * chỗ sẽ nói hai con số khác nhau, và đó là loại lỗi không ai báo.
 *
 * Số của MÁY CHỦ vẫn là số chính thức: mọi lần taiLaiLo đều ghi đè lại bảng này.
 */
function tron2(x) {
  var n = Number(x);
  if (isNaN(n)) return null;
  return Math.round(n * 100) / 100;
}

function canhBaoBuiHaoHut(v) {
  if (v === null || v === undefined) return '';
  var thap = Number(S.cauHinh.HAO_HUT_MIN), cao = Number(S.cauHinh.HAO_HUT_MAX);
  var khoang = ' (mức thường gặp ' + thap + '–' + cao + '%)';
  if (v < 0) {
    return 'Bụi + hao hụt ' + v + '%: khối lượng ra ĐANG NHIỀU HƠN khối lượng vào. ' +
           'Chắc chắn có số nhập sai — kiểm tra lại khối lượng đầu vào và các bao.';
  }
  if (!isNaN(thap) && v < thap) {
    return 'Bụi + hao hụt ' + v + '% — THẤP bất thường' + khoang +
           '. Kiểm tra lại khối lượng đầu vào và các bao đã nhập.';
  }
  if (!isNaN(cao) && v > cao) {
    return 'Bụi + hao hụt ' + v + '% — CAO bất thường' + khoang +
           '. Kiểm tra lại khối lượng đầu vào và các bao đã nhập.';
  }
  return '';
}

function capNhatKetQuaTaiCho() {
  if (!S.lo) return;

  var soBao = { '1': 0, '2': 0, '3': 0 }, kl = { '1': 0, '2': 0, '3': 0 };
  S.dsBao.forEach(function (b) {
    var l = String(b.loai);
    if (!soBao.hasOwnProperty(l)) return;
    soBao[l]++;
    kl[l] += Number(b.khoi_luong) || 0;
  });

  var klVao = Number(S.lo.kl_vao);
  var co = (S.lo.kl_vao !== null && S.lo.kl_vao !== undefined && S.lo.kl_vao !== '' &&
            !isNaN(klVao) && klVao > 0);

  var soLe = Number(S.cauHinh.SO_LE);
  if (isNaN(soLe) || soLe < 0) soLe = 1;
  var he = Math.pow(10, soLe);
  var lamTron = function (x) { return Math.round(Number(x) * he) / he; };

  var tiLe = { '1': null, '2': null, '3': null }, tong = 0;
  if (co) {
    ['1', '2', '3'].forEach(function (l) {
      tiLe[l] = tron2(kl[l] / klVao * 100);
      tong += tiLe[l];
    });
  }

  var d = {
    ma_lo: S.lo.ma_lo,
    ky_hieu: S.lo.ky_hieu,
    trang_thai: S.lo.trang_thai,
    so_bao_vao: S.lo.so_bao_vao,
    kl_vao: co ? lamTron(klVao) : null,
    co_kl_vao: co,
    ds_loai: ['1', '2', '3'].map(function (l) {
      return { loai: l, nhom: S.lo.ky_hieu + l, so_bao: soBao[l],
               tong_kl: lamTron(kl[l]), ti_le: tiLe[l] };
    }),
    tong_so_bao_ra: soBao['1'] + soBao['2'] + soBao['3'],
    tong_kl_ra: lamTron(kl['1'] + kl['2'] + kl['3']),
    tong_ti_le_thu_hoi: co ? tron2(tong) : null,
    ti_le_hao_hut: co ? tron2(100 - tong) : null,
    hao_hut_min: Number(S.cauHinh.HAO_HUT_MIN),
    hao_hut_max: Number(S.cauHinh.HAO_HUT_MAX),
    nguoi_chua_chot: []
  };
  d.canh_bao = canhBaoBuiHaoHut(d.ti_le_hao_hut);

  S.ketQua = d;
  veKetQua(d);
}

function phanTram(v) {
  if (v === null || v === undefined || v === '') return '—';
  var n = Number(v);
  if (isNaN(n)) return '—';
  return n.toFixed(2) + '%';
}

/*
 * Bảng tỉ lệ. Dùng chung cho màn hình NHẬP LIỆU và màn hình CHI TIẾT LÔ.
 *
 * Dòng "Bụi + hao hụt" nằm NGAY DƯỚI ba loại (Andy chốt 22/08/2026): chỉ có tỉ lệ,
 * không có số bao / khối lượng — đây là phần TÍNH RA (100% − thu hồi), không ai cân nó.
 */
/*
 * Ai được xem CHI TIẾT TỪNG LOẠI (bản 1.7 — Andy chốt 25/08/2026, ý tưởng 2 / 2B).
 *
 * Người vận hành máy chỉ cần 3 con số: tổng bao ra, tổng kg ra, bụi + hao hụt.
 * Chi tiết từng loại làm họ phân tâm giữa lúc đang nhập, mà nhập bao mới là việc
 * của họ. Thống kê và Quản lý vẫn thấy đủ.
 *
 * ⚠️ Đây là chuyện BỚT PHÂN TÂM, KHÔNG phải chuyện giữ bí mật. Mỗi dòng bao trên
 * màn hình vẫn ghi rõ loại của nó, ai cộng lại cũng ra. Muốn giấu thật thì phải cắt
 * ngay ở máy chủ — mà chính máy chủ đang cần số liệu đó để tính tổng, nên cắt cũng
 * vô nghĩa. Đừng nhầm hàm này với một chốt chặn quyền.
 *
 * Dùng DANH SÁCH TRẮNG giống chỗ nút "Xem tổng hợp": gõ sai cột vai_tro trong sheet
 * thì rơi về mức thấy ÍT hơn, không phải nhiều hơn.
 */
function xemChiTietLoai() {
  var v = S.nguoiDung ? String(S.nguoiDung.vai_tro || '') : '';
  return (v === 'THONG_KE' || v === 'QUAN_LY');
}

/* Bảng rút gọn cho người vận hành máy: đúng 3 con số Andy chốt. */
function htmlBangTiLeGon(d) {
  return '<table class="bang-kq bang-kq-gon"><tbody>' +
           '<tr class="tong"><td>Tổng bao ra</td>' +
             '<td class="so">' + d.tong_so_bao_ra + '</td></tr>' +
           '<tr class="tong"><td>Tổng khối lượng ra</td>' +
             '<td class="so">' + d.tong_kl_ra + ' kg</td></tr>' +
           '<tr class="bui' + (d.canh_bao ? ' lech' : '') + '">' +
             '<td>Bụi + hao hụt</td>' +
             '<td class="ti-le">' + phanTram(d.ti_le_hao_hut) + '</td>' +
           '</tr></tbody></table>';
}

function htmlBangTiLe(d) {
  if (!xemChiTietLoai()) return htmlBangTiLeGon(d);

  var h = '<table class="bang-kq"><thead><tr>' +
          '<th>Loại</th><th>Số bao</th><th>Khối lượng</th><th>Tỉ lệ thu hồi</th>' +
          '</tr></thead><tbody>';
  d.ds_loai.forEach(function (x) {
    h += '<tr data-loai="' + escapeHtml(x.loai) + '">' +
           '<td class="o-nhom">' + escapeHtml(x.nhom) + '</td>' +
           '<td class="so">' + x.so_bao + '</td>' +
           '<td class="so">' + x.tong_kl + ' kg</td>' +
           '<td class="ti-le">' + phanTram(x.ti_le) + '</td>' +
         '</tr>';
  });
  h += '<tr class="tong">' +
         '<td>Tổng ra</td>' +
         '<td class="so">' + d.tong_so_bao_ra + '</td>' +
         '<td class="so">' + d.tong_kl_ra + ' kg</td>' +
         '<td class="ti-le">' + phanTram(d.tong_ti_le_thu_hoi) + '</td>' +
       '</tr>' +
       '<tr class="bui' + (d.canh_bao ? ' lech' : '') + '">' +
         '<td colspan="3">Bụi + hao hụt</td>' +
         '<td class="ti-le">' + phanTram(d.ti_le_hao_hut) + '</td>' +
       '</tr></tbody></table>';
  return h;
}

function veKetQua(d) {
  if (!d) {
    $('bangKetQua').innerHTML = '';
    an('canhBaoKetQua');
    anLoi('thieuKlVao');
    return;
  }

  /* KHÔNG đụng vào ô khối lượng đầu vào khi công nhân đang gõ dở trong đó — cùng
     nguyên tắc đã áp cho ô số bao ở datGoiYStt. */
  if (document.activeElement !== $('inKlVao')) {
    $('inKlVao').value = d.co_kl_vao ? d.kl_vao : '';
    echoKlVao('inKlVao', 'echoKlVao');
  }
  if (d.co_kl_vao) anLoi('thieuKlVao');
  else hienLoi('thieuKlVao',
    'Chưa có khối lượng đầu vào nên chưa tính được tỉ lệ. Nhập vào ô trên rồi bấm LƯU.');

  $('bangKetQua').innerHTML = htmlBangTiLe(d);

  if (d.canh_bao) {
    $('canhBaoKetQua').textContent = '⚠️ ' + d.canh_bao;
    hien('canhBaoKetQua');
  } else {
    an('canhBaoKetQua');
  }
}

function luuKlVao() {
  var v = String($('inKlVao').value || '').trim();
  var n = soLonTu(v);
  if (isNaN(n) || n <= 0) {
    toast('Không đọc được "' + v + '". Gõ 1000 hoặc 1.000', 'do');
    rung([60, 50, 60]);
    return;
  }
  cho(true);
  goi('apiCapNhatKlVao', [S.ve, S.lo.ma_lo, v])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { toast(kq ? kq.error : 'Lỗi', 'do'); return; }
      // Máy chủ đã trả về kết quả tính lại ngay trong lượt gọi này -> vẽ luôn,
      // KHÔNG hỏi thêm lượt nữa: hai lượt gọi chồng nhau chính là thứ từng làm
      // màn hình hiện số cũ sau khi đã lưu.
      S.lo.kl_vao = kq.data.kl_vao;
      S.ketQua = kq.data;
      veKetQua(kq.data);
      toast('Đã lưu khối lượng đầu vào', 'xanh');
    })
    .catch(function () {
      cho(false);
      toast('Mất mạng — lưu khối lượng đầu vào cần có mạng', 'do');
    });
}

/* ============================================================
   LÔ ĐÃ ĐÓNG — XEM LẠI  (bản 1.6, yêu cầu 2)
   ============================================================ */

/*
 * Công nhân chỉ thấy lô CHÍNH MÌNH có nhập bao; thống kê và quản lý thấy tất cả.
 * Việc lọc do máy chủ làm (apiLoDaDong) dựa trên cột ds_nguoi_nhap của sheet LO —
 * giao diện KHÔNG tự lọc lại, vì lọc ở đây thì dữ liệu vẫn đã về tới máy rồi.
 */
function moLoDaDong() {
  chuyenManHinh('LoDaDong');
  $('ghiChuLoDaDong').textContent = '';
  $('dsLoDaDong').innerHTML = '<p class="ghi-chu-mo">Đang tải…</p>';

  goi('apiLoDaDong', [S.ve, '', ''])
    .then(function (kq) {
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) {
        $('dsLoDaDong').innerHTML = '<p class="ghi-chu-mo">' +
          escapeHtml(kq ? kq.error : 'Lỗi') + '</p>';
        return;
      }
      S.dsLoDong = kq.data.ds || [];
      $('ghiChuLoDaDong').innerHTML = kq.data.xem_het
        ? 'Toàn bộ lô đã đóng.'
        : 'Chỉ hiện những lô <b>bạn có nhập bao</b>.';

      if (!S.dsLoDong.length) {
        $('dsLoDaDong').innerHTML = '<p class="ghi-chu-mo">Chưa có lô nào đã đóng.</p>';
        return;
      }

      var h = '';
      S.dsLoDong.forEach(function (l, i) {
        h += '<div class="the-lo-ds" onclick="moChiTietTheoViTri(' + i + ')">' +
               '<div>' +
                 '<div class="ma">' + escapeHtml(l.ma_lo) + '</div>' +
                 '<div class="phu">Ký hiệu <b>' + escapeHtml(l.ky_hieu) + '</b>' +
                   ' · đóng ' + escapeHtml(String(l.tg_dong).substring(0, 16)) +
                   (l.kl_vao !== null ? ' · vào ' + l.kl_vao + ' kg' : '') +
                   '</div>' +
               '</div>' +
               '<div class="so"><b>' + l.so_bao_ra + '</b>bao ra<br>' + l.tong_kl_ra + ' kg</div>' +
             '</div>';
      });
      if (kq.data.con_nua) {
        h += '<p class="ghi-chu-mo">Chỉ hiện ' + S.dsLoDong.length +
             ' lô đóng gần nhất (tổng ' + kq.data.tong + ' lô).</p>';
      }
      $('dsLoDaDong').innerHTML = h;
    })
    .catch(function () {
      $('dsLoDaDong').innerHTML = '<p class="ghi-chu-mo">Mất kết nối.</p>';
    });
}

// Truyền VỊ TRÍ chứ không ghép mã lô vào onclick — cùng nguyên tắc của bản 1.2.
function moChiTietTheoViTri(i) {
  var l = S.dsLoDong && S.dsLoDong[i];
  if (l) moChiTietLo(l.ma_lo, 'LoDaDong');
}

/* ============================================================
   CHI TIẾT MỘT LÔ  (bản 1.6 — dùng chung cho xem lại và quyền quản lý)
   ============================================================ */

/*
 * Màn hình này CỐ Ý tách khỏi màn hình nhập liệu, dù cả hai đọc cùng một gói dữ liệu.
 * Màn hình nhập liệu có LƯU BAO, CHỐT CA, ĐÓNG LÔ — chỉ cần một lỗi ẩn nút là công
 * nhân bấm nhầm vào lô đã khoá. Ở đây không có nút nào trong số đó.
 *
 * @param {string} veTu  'ThongKe' | 'LoDaDong' — bấm Quay lại thì về đúng chỗ đã đến
 */
function moChiTietLo(maLo, veTu) {
  S.veTu = veTu || 'ChonLo';
  chuyenManHinh('ChiTietLo');
  $('ctMaLo').textContent = maLo;
  $('ctPhu').textContent = 'Đang tải…';
  $('ctSoBao').textContent = '—';
  $('ctBangTiLe').innerHTML = '';
  $('ctThongTin').innerHTML = '';
  $('ctDsBao').innerHTML = '';
  an('ctKhuQuanLy');
  an('ctChiDoc');
  an('ctCanhBao');
  taiLaiLo(maLo);
}

function quayLaiTuChiTiet() {
  if (S.veTu === 'ThongKe') moThongKe();
  else if (S.veTu === 'LoDaDong') moLoDaDong();
  else veManHinhLo();
}

function dongTT(nhan, giaTri) {
  return '<div class="dong-tt"><span>' + escapeHtml(nhan) + '</span><b>' +
         escapeHtml(giaTri) + '</b></div>';
}

function veChiTietLo() {
  var lo = S.lo;
  if (!lo) return;
  var daDong = (String(lo.trang_thai).toUpperCase() === 'DA_DONG');

  $('ctMaLo').textContent = lo.ma_lo;
  $('ctPhu').textContent = 'Ký hiệu ' + lo.ky_hieu + ' · ' + (daDong ? 'Đã đóng' : 'Đang chạy');
  $('ctSoBao').textContent = S.dsBao.length;
  $('ctDemBao').textContent = S.dsBao.length;

  // Bảng tỉ lệ — dùng chung hàm với màn hình nhập liệu
  if (S.ketQua) {
    $('ctBangTiLe').innerHTML = htmlBangTiLe(S.ketQua);
    if (S.ketQua.canh_bao) {
      $('ctCanhBao').textContent = '⚠️ ' + S.ketQua.canh_bao;
      hien('ctCanhBao');
    } else {
      an('ctCanhBao');
    }
  } else {
    $('ctBangTiLe').innerHTML = '<p class="ghi-chu-mo">Chưa tính được tỉ lệ.</p>';
    an('ctCanhBao');
  }

  $('ctThongTin').innerHTML =
    dongTT('Trạng thái', daDong ? 'Đã đóng' : 'Đang chạy') +
    dongTT('Số bao đầu vào', lo.so_bao_vao === null ? '—' : String(lo.so_bao_vao)) +
    dongTT('Khối lượng đầu vào', lo.kl_vao === null ? '—' : lo.kl_vao + ' kg') +
    dongTT('Ghi chú', lo.ghi_chu || '—') +
    dongTT('Mở lúc', String(lo.tg_mo || '—').substring(0, 16)) +
    (daDong ? dongTT('Đóng lúc', String(lo.tg_dong || '—').substring(0, 16)) : '');

  var h = htmlDsBaoTheoCa(S.dsBao);
  $('ctDsBao').innerHTML = h || '<p class="ghi-chu-mo">Lô này không có bao nào.</p>';

  if (S.laQuanLy) {
    hien('ctKhuQuanLy');
    an('ctChiDoc');
    // Chỉ mở lại được lô ĐÃ ĐÓNG
    $('btnMoLaiLo').disabled = !daDong;
  } else {
    an('ctKhuQuanLy');
    $('ctChiDoc').textContent = daDong
      ? '🔒 Lô đã đóng — chỉ xem lại, không sửa được. Cần sửa thì báo quản lý.'
      : 'Lô này đang chạy. Muốn nhập bao thì vào từ danh sách “Lô đang chạy”.';
    hien('ctChiDoc');
  }
}

/* ---------- Sửa thông tin lô (số bao vào / khối lượng vào / ghi chú) ---------- */

function moSuaThongTinLo() {
  if (!S.lo) return;
  $('ttMaLo').textContent = S.lo.ma_lo;
  $('ttSoBaoVao').value = (S.lo.so_bao_vao === null || S.lo.so_bao_vao === undefined)
                            ? '' : S.lo.so_bao_vao;
  $('ttKlVao').value = (S.lo.kl_vao === null || S.lo.kl_vao === undefined) ? '' : S.lo.kl_vao;
  $('ttGhiChu').value = S.lo.ghi_chu || '';
  echoKlVao('ttKlVao', 'ttEchoKl');
  $('ttLyDo').value = '';
  if (S.laQuanLy) hien('khuLyDoTT'); else an('khuLyDoTT');
  anLoi('loiSuaTT');
  hien('lopSuaTT');
}

function dongSuaThongTinLo(e) {
  if (e && e.target && e.target.id !== 'lopSuaTT') return;
  an('lopSuaTT');
}

function luuThongTinLo() {
  if (!S.lo) return;
  anLoi('loiSuaTT');
  cho(true);
  goi('apiSuaLo', [S.ve, S.lo.ma_lo, {
        so_bao_vao: $('ttSoBaoVao').value,
        kl_vao: $('ttKlVao').value,
        ghi_chu: $('ttGhiChu').value
      }, $('ttLyDo').value])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiSuaTT', kq ? kq.error : 'Lỗi'); return; }
      an('lopSuaTT');
      toast('✔ Đã sửa thông tin lô', 'xanh');
      taiLaiLo(S.lo.ma_lo, true);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiSuaTT', 'Mất mạng — sửa thông tin lô cần có mạng.');
    });
}

/* ---------- Mở lại lô ---------- */

function moHopMoLaiLo() {
  if (!S.lo) return;
  if (String(S.lo.trang_thai).toUpperCase() !== 'DA_DONG') {
    toast('Lô này đang chạy, không có gì để mở lại', 'do');
    return;
  }
  $('mlMaLo').textContent = S.lo.ma_lo;
  $('tomTatMoLai').textContent = 'Lô ' + S.lo.ma_lo + ' — ' + S.dsBao.length +
    ' bao đã nhập. Đóng lúc ' + String(S.lo.tg_dong || '').substring(0, 16) + '.';
  $('tichMoLai').checked = false;
  $('mlLyDo').value = '';
  $('btnXacNhanMoLai').disabled = true;
  anLoi('loiMoLai');
  hien('lopMoLaiLo');
}

function dongHopMoLaiLo(e) {
  if (e && e.target && e.target.id !== 'lopMoLaiLo') return;
  an('lopMoLaiLo');
}

function doiTichMoLaiLo() {
  var tich = $('tichMoLai').checked;
  $('btnXacNhanMoLai').disabled = !tich;
  if (tich) anLoi('loiMoLai');
}

function xacNhanMoLaiLo() {
  if (!S.lo) return;
  anLoi('loiMoLai');
  if (!$('tichMoLai').checked) {
    hienLoi('loiMoLai', 'Hãy tích vào ô xác nhận trước.');
    rung([60, 50, 60]);
    return;
  }
  cho(true);
  goi('apiMoLaiLo', [S.ve, S.lo.ma_lo, 'XAC_NHAN', $('mlLyDo').value])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiMoLai', kq ? kq.error : 'Lỗi'); return; }
      an('lopMoLaiLo');
      toast('🔓 Đã mở lại lô ' + kq.data.ma_lo, 'xanh');
      taiLaiLo(S.lo.ma_lo, true);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiMoLai', 'Mất mạng — mở lại lô cần có mạng.');
    });
}

/* ============================================================
   SỬA MÃ LÔ / XOÁ LÔ
   (chỉ người tạo lô hoặc quản lý — máy chủ kiểm tra lại lần nữa)
   ============================================================ */

function moSuaMaLo() {
  if (!S.lo) return;
  $('maLoCu').textContent = S.lo.ma_lo;
  $('inMaLoMoi').value = S.lo.ma_lo;
  $('lyDoMaLo').value = '';
  if (S.laQuanLy) hien('khuLyDoMaLo'); else an('khuLyDoMaLo');
  anLoi('loiSuaLo');
  xemTruocKyHieuSua();
  hien('lopSuaLo');
  setTimeout(function () { $('inMaLoMoi').focus(); }, 100);
}

function dongSuaMaLo(e) {
  if (e && e.target && e.target.id !== 'lopSuaLo') return;
  an('lopSuaLo');
}

function xemTruocKyHieuSua() {
  var v = String($('inMaLoMoi').value || '').trim().toUpperCase();
  $('inMaLoMoi').value = v;
  var o = $('xemKyHieuSua');
  var a = String(S.cauHinh.TIEN_TO_A).toUpperCase();
  var b = String(S.cauHinh.TIEN_TO_B).toUpperCase();
  var c = v.charAt(0);
  if (!v) { o.className = 'xem-ky-hieu'; o.textContent = 'Ký hiệu sẽ là: —'; return; }
  var day = chuanMaLo7(v);
  if (day) {
    var kh = (day.charAt(0) === a) ? 'A' : 'B';
    o.className = 'xem-ky-hieu dung';
    o.textContent = (day === v ? '✓ Ký hiệu: ' + kh : '✓ Máy hiểu: ' + day + '  ·  ký hiệu ' + kh) +
      (S.lo && kh !== S.lo.ky_hieu
        ? '  ⚠️ ĐỔI từ ' + S.lo.ky_hieu + ' sang ' + kh + ' — cả lô sang nhóm số bao khác'
        : '');
  } else {
    o.className = 'xem-ky-hieu sai';
    o.textContent = '✕ Mã lô phải là 7 ký tự: "' + S.cauHinh.TIEN_TO_A + '" hoặc "' +
                    S.cauHinh.TIEN_TO_B + '" + 4 số + 2 chữ.';
  }
}

function luuMaLoMoi() {
  var moi = String($('inMaLoMoi').value || '').trim().toUpperCase();
  anLoi('loiSuaLo');
  if (!moi) { hienLoi('loiSuaLo', 'Chưa nhập mã lô mới.'); return; }
  if (moi === S.lo.ma_lo) { hienLoi('loiSuaLo', 'Mã mới trùng mã cũ.'); return; }

  cho(true);
  goi('apiSuaMaLo', [S.ve, S.lo.ma_lo, moi, $('lyDoMaLo').value])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiSuaLo', kq ? kq.error : 'Lỗi'); return; }
      an('lopSuaLo');
      toast('✔ Đã đổi thành ' + kq.data.ma_lo + ' (' + kq.data.so_bao_doi + ' bao đi theo)', 'xanh');
      if (S.manHinh === 'ChiTietLo') taiLaiLo(kq.data.ma_lo, true);
      else moLo(kq.data.ma_lo);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiSuaLo', 'Mất mạng — sửa mã lô cần có mạng.');
    });
}

function moXoaLo() {
  if (!S.lo) return;
  var soBao = S.dsBao.length;
  var kl = 0;
  S.dsBao.forEach(function (b) { kl += Number(b.khoi_luong) || 0; });
  $('maLoXoa').textContent = S.lo.ma_lo;
  $('tomTatXoa').textContent = 'Sẽ xoá lô ' + S.lo.ma_lo + ' và toàn bộ ' + soBao +
                               ' bao (' + (Math.round(kl * 10) / 10) + ' kg) đã nhập.';
  $('inXacNhanXoa').value = '';
  $('lyDoXoaLo').value = '';
  if (S.laQuanLy) hien('khuLyDoXoaLo'); else an('khuLyDoXoaLo');
  anLoi('loiXoaLo');
  hien('lopXoaLo');
}

function dongXoaLo(e) {
  if (e && e.target && e.target.id !== 'lopXoaLo') return;
  an('lopXoaLo');
}

function xacNhanXoaLo() {
  var go = String($('inXacNhanXoa').value || '').trim().toUpperCase();
  anLoi('loiXoaLo');
  if (go !== String(S.lo.ma_lo).toUpperCase()) {
    hienLoi('loiXoaLo', 'Gõ chưa đúng mã lô. Phải gõ chính xác: ' + S.lo.ma_lo);
    rung([60, 50, 60]);
    return;
  }

  cho(true);
  goi('apiXoaLo', [S.ve, S.lo.ma_lo, go, $('lyDoXoaLo').value])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiXoaLo', kq ? kq.error : 'Lỗi'); return; }
      an('lopXoaLo');
      toast('Đã xoá lô ' + kq.data.ma_lo + ' (' + kq.data.so_bao_da_xoa + ' bao)', 'xanh');
      var tuChiTiet = (S.manHinh === 'ChiTietLo');
      S.lo = null;
      if (tuChiTiet) quayLaiTuChiTiet(); else veManHinhLo();
    })
    .catch(function () {
      cho(false);
      hienLoi('loiXoaLo', 'Mất mạng — xoá lô cần có mạng.');
    });
}

/* ============================================================
   MÀN HÌNH XỬ LÝ KHAY BAO LỖI
   ============================================================ */

function moKhayLoi() {
  veKhayLoi();
  hien('lopKhayLoi');
}

function dongKhayLoi(e) {
  if (e && e.target && e.target.id !== 'lopKhayLoi') return;
  an('lopKhayLoi');
}

function veKhayLoi() {
  var k = layKhayLoi();
  if (!k.length) {
    $('dsKhayLoi').innerHTML = '<p class="ghi-chu-mo">Không còn bao nào bị treo. Tốt.</p>';
    an('lopKhayLoi');
    veTrangThai();
    return;
  }

  var h = '';
  k.forEach(function (b, i) {
    // Bao của người khác thì KHÔNG cho gửi lại bằng tài khoản đang đăng nhập —
    // cùng chốt chặn với hàng đợi, tránh ghi nhầm tên người nhập.
    var cuaNguoiKhac = b.ma_nv && S.nguoiDung && b.ma_nv !== S.nguoiDung.ma_nv;
    h += '<div class="bao-loi">' +
           '<div class="bao-loi-dau">' +
             '<b>' + escapeHtml(b.ma_lo) + '</b> · nhóm ' +
             escapeHtml(String(b.ky_hieu || '') + String(b.loai || '')) +
             '<span class="bao-loi-luc">' + escapeHtml(String(b.luc || '').substring(5)) + '</span>' +
           '</div>' +
           '<div class="bao-loi-vi-sao">✕ ' + escapeHtml(b.ly_do) + '</div>';

    if (cuaNguoiKhac) {
      h += '<div class="bao-loi-vi-sao">Bao này của ' + escapeHtml(b.ten_nguoi || b.ma_nv) +
           '. Nhờ người đó đăng nhập trên chính máy này để xử lý.</div>';
    } else {
      h += '<div class="bao-loi-sua">' +
             '<input class="o-nhap kl-stt" type="text" inputmode="numeric" pattern="[0-9]*" ' +
               'value="' + escapeHtml(b.stt_bao) + '" aria-label="Số bao">' +
             '<input class="o-nhap kl-kg" type="text" inputmode="decimal" ' +
               'value="' + escapeHtml(b.khoi_luong) + '" aria-label="Khối lượng">' +
           '</div>' +
           '<div class="bao-loi-nut">' +
             '<button class="nut-nho-vien" onclick="guiLaiBaoLoi(' + i + ')">↻ Gửi lại</button>' +
             '<button class="nut-nho-vien nguy-hiem" onclick="boBaoLoi(' + i + ')">🗑 Bỏ bao này</button>' +
           '</div>';
    }
    h += '</div>';
  });
  $('dsKhayLoi').innerHTML = h;
  $('demKhayLoi').textContent = k.length;
}

/** Lấy giá trị công nhân vừa sửa ngay trên thẻ bao lỗi thứ i. */
function _oBaoLoi(i) {
  var the = document.querySelectorAll('#dsKhayLoi .bao-loi')[i];
  if (!the) return null;
  var oS = the.querySelector('.kl-stt'), oK = the.querySelector('.kl-kg');
  if (!oS || !oK) return null;
  return { stt: soTu(oS.value), kl: klBaoTu(oK.value) };   // bản 1.7 — xem klBaoTu
}

function guiLaiBaoLoi(i) {
  var k = layKhayLoi();
  var b = k[i];
  if (!b) return;

  var o = _oBaoLoi(i);
  if (!o || isNaN(o.stt) || o.stt <= 0 || o.stt !== Math.floor(o.stt)) {
    toast('Số bao phải là số nguyên dương', 'do'); return;
  }
  if (isNaN(o.kl) || o.kl < S.cauHinh.KL_MIN || o.kl > S.cauHinh.KL_MAX) {
    toast('Khối lượng phải trong khoảng ' + S.cauHinh.KL_MIN + '–' + S.cauHinh.KL_MAX + ' kg', 'do');
    return;
  }

  var gui = {
    ma_lo: b.ma_lo, loai: b.loai, stt_bao: o.stt, khoi_luong: o.kl,
    phien: S.phien, client_id: b.client_id
  };

  cho(true);
  goi('apiLuuBao', [S.ve, gui])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) {
        // Vẫn bị từ chối -> cập nhật lý do mới, GIỮ NGUYÊN trong khay.
        var k2 = layKhayLoi();
        if (k2[i]) {
          k2[i].stt_bao = o.stt; k2[i].khoi_luong = o.kl;
          k2[i].ly_do = kq ? kq.error : 'Máy chủ từ chối';
          luuKhayLoi(k2);
        }
        veKhayLoi();
        toast('Vẫn chưa gửi được — xem lý do trên thẻ', 'do');
        return;
      }
      var k3 = layKhayLoi();
      k3.splice(i, 1);
      luuKhayLoi(k3);
      veKhayLoi();
      veTrangThai();
      toast(kq.data.trung_lap_bo_qua
              ? '✔ Bao này thực ra đã lên hệ thống từ trước'
              : '✔ Đã gửi lên bao ' + o.stt, 'xanh');
      if (S.lo && b.ma_lo === S.lo.ma_lo) taiLaiLo(S.lo.ma_lo, true);
    })
    .catch(function () {
      cho(false);
      toast('Mất mạng — thử lại khi có mạng', 'do');
    });
}

function boBaoLoi(i) {
  var k = layKhayLoi();
  var b = k[i];
  if (!b) return;
  if (!confirm('BỎ HẲN bao ' + b.stt_bao + ' (' + b.khoi_luong + ' kg) của lô ' + b.ma_lo + '?\n\n' +
               'Bao này sẽ KHÔNG có trong số liệu. Việc bỏ được ghi vào nhật ký kèm tên bạn.\n\n' +
               'Chỉ bỏ khi chắc chắn bao này đã được nhập bằng cách khác, hoặc không có thật.')) return;

  cho(true);
  goi('apiGhiBaoLoi', [S.ve, b, b.ly_do, 'BO'])
    .then(function () { _boKhoiKhay(i); })
    .catch(function () {
      cho(false);
      toast('Mất mạng — phải có mạng mới bỏ được (để còn ghi nhật ký)', 'do');
    });
}

function _boKhoiKhay(i) {
  cho(false);
  var k = layKhayLoi();
  k.splice(i, 1);
  luuKhayLoi(k);
  veKhayLoi();
  veTrangThai();
  toast('Đã bỏ bao và ghi vào nhật ký', 'do');
}

/* ============================================================
   AN TOÀN HIỂN THỊ
   ============================================================ */

function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
</script>
