<script>
/* ============================================================
   Máy 1 buồng — Logic phía điện thoại
   Không dùng thư viện ngoài => chạy được cả khi mạng yếu.
   ============================================================ */

var KHOA = { VE: 'm1b_ve', PHIEN: 'm1b_phien', HANG_DOI: 'm1b_hangdoi',
             KHAY_LOI: 'm1b_khayloi' };

var S = {
  ve: null,
  nguoiDung: null,
  phien: null,
  cauHinh: { KL_MIN: 1, KL_MAX: 100, SO_LE: 1, TIEN_TO_A: 'T', TIEN_TO_B: 'D',
             MA_LO_HAU_TO: 'LA',
             SO_BAO_MOI_LAN: 20, HAO_HUT_MIN: 20, HAO_HUT_MAX: 30 },
  dsNguoiDung: [],
  maNvDangChon: null,
  tenDangChon: '',
  pin: '',
  pinDoDai: 4,
  dsLo: [],
  lo: null,
  dsBao: [],
  goiYStt: {},
  loaiDangChon: null,
  baoDangSua: null,
  loaiSuaGoc: null,        // loại của bao TRƯỚC khi sửa — để biết có đổi loại không
  loaiSuaDangChon: null,   // loại đang chọn trong hộp sửa bao (bản 1.8)
  cheDoChon: false,        // đang bật chế độ chọn nhiều bao? (bản 1.8)
  daChon: {},              // id bao -> true, các bao đang được tích
  ketQua: null,
  duocSuaLo: false,
  laQuanLy: false,
  vuaLuu: {},          // id các bao của MẺ VỪA LƯU — xem htmlDsBaoTheoCa
  dsLoDong: [],
  dsTongHop: [],
  veTu: 'ChonLo',      // màn hình nào đã mở CHI TIẾT LÔ — để nút Quay lại về đúng chỗ
  manHinh: 'DangNhap',
  dangGui: false
};

/* ============================================================
   TIỆN ÍCH
   ============================================================ */

function $(id) { return document.getElementById(id); }
function hien(id) { $(id).classList.remove('an'); }
function an(id) { $(id).classList.add('an'); }

function luuLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function docLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function xoaLocal(k) { try { localStorage.removeItem(k); } catch (e) {} }

var _toastTimer = null;
function toast(text, mau) {
  var t = $('toast');
  t.textContent = text;
  t.className = 'toast' + (mau ? ' ' + mau : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { t.classList.add('an'); }, 2800);
}

function cho(bat) { if (bat) hien('manCho'); else an('manCho'); }

function hienLoi(idO, text) {
  var o = $(idO);
  o.textContent = text;
  o.classList.remove('an');
}
function anLoi(idO) { $(idO).classList.add('an'); }

function rung(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 40); } catch (e) {} }

/**
 * Đổi chuỗi người dùng gõ thành số.
 * Chấp nhận dấu PHẨY thập phân — bàn phím số tiếng Việt trên iPhone/Android
 * cho ra dấu "," chứ không phải "." khi gõ 49,8.
 */
function soTu(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().replace(/\s/g, '');
  if (s === '') return NaN;
  s = s.replace(',', '.');
  if (!/^\d*\.?\d+$/.test(s)) return NaN;
  return Number(s);
}

/**
 * Bản khách của soLonTu_ trên máy chủ — HIỂU DẤU PHÂN CÁCH NGHÌN.
 * Chỉ dùng cho ô KHỐI LƯỢNG ĐẦU VÀO CẢ LÔ. Ô khối lượng từng BAO vẫn dùng soTu(),
 * nơi dấu phẩy luôn là dấu thập phân ("49,8" = 49.8 kg).
 * Máy chủ soát lại lần nữa bằng docKlVao_ — bản này chỉ để hiện ngay cho công nhân thấy.
 */
function soLonTu(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().replace(/\s/g, '');
  if (s === '') return NaN;
  if (!/^[0-9.,]+$/.test(s)) return NaN;

  var coCham = s.indexOf('.') >= 0, coPhay = s.indexOf(',') >= 0;
  var dauNghin = '', dauLe = '';
  if (coCham && coPhay) {
    dauLe = (s.lastIndexOf('.') > s.lastIndexOf(',')) ? '.' : ',';
    dauNghin = (dauLe === '.') ? ',' : '.';
  } else if (coCham || coPhay) {
    var d = coCham ? '.' : ',';
    if (s.split(d).length - 1 >= 2) dauNghin = d;
    else {
      var sau = s.substring(s.indexOf(d) + 1);
      if (/^\d{3}$/.test(sau) && s.indexOf(d) > 0) dauNghin = d; else dauLe = d;
    }
  }
  var nguyen = s, le = '';
  if (dauLe) {
    var vt = s.lastIndexOf(dauLe);
    nguyen = s.substring(0, vt); le = s.substring(vt + 1);
    if (!/^\d+$/.test(le)) return NaN;
  }
  if (dauNghin) {
    var nhom = nguyen.split(dauNghin);
    if (nhom.length < 2 || !/^\d{1,3}$/.test(nhom[0])) return NaN;
    for (var i = 1; i < nhom.length; i++) if (!/^\d{3}$/.test(nhom[i])) return NaN;
    nguyen = nhom.join('');
  }
  if (!/^\d+$/.test(nguyen)) return NaN;
  var kq = Number(nguyen + (le ? '.' + le : ''));
  return isNaN(kq) ? NaN : kq;
}

/** Số kg hiện lại cho dễ đọc: 1000 -> "1.000". */
function kgDeDoc(n) {
  var s = String(n);
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return p.join(',');
}

/**
 * Hiện lại NGAY con số máy đã hiểu, dưới ô khối lượng đầu vào.
 * Đây mới là chốt chặn thật: quy tắc đoán dấu phân cách nghìn kiểu gì cũng có ngoại
 * lệ, nên phải để công nhân nhìn thấy số máy hiểu TRƯỚC khi bấm lưu.
 */
function echoKlVao(idO, idEcho) {
  var o = document.getElementById(idEcho);
  var v = String(document.getElementById(idO).value || '').trim();
  if (!v) { o.className = 'xem-ky-hieu'; o.textContent = 'Máy sẽ hiểu: —'; return; }
  var n = soLonTu(v);
  if (isNaN(n) || n <= 0) {
    o.className = 'xem-ky-hieu sai';
    o.textContent = '✕ Không đọc được "' + v + '". Gõ 1000 hoặc 1.000';
  } else {
    o.className = 'xem-ky-hieu dung';
    o.textContent = '✓ Máy hiểu: ' + kgDeDoc(n) + ' kg';
  }
}

/**
 * Gọi hàm máy chủ, trả về Promise.
 * - resolve: máy chủ trả lời (kể cả lỗi nghiệp vụ {ok:false})
 * - reject : KHÔNG gọi được máy chủ (mất mạng / script lỗi)
 */
function goi(ten, args) {
  return new Promise(function (res, rej) {
    var r = google.script.run
      .withSuccessHandler(function (kq) { res(kq); })
      .withFailureHandler(function (err) {
        rej({ mangLoi: true, message: (err && err.message) ? err.message : 'Không kết nối được máy chủ' });
      });
    r[ten].apply(r, args || []);
  });
}

/** Xử lý chung khi máy chủ báo phiên hết hạn. */
function kiemTraPhien(kq) {
  if (kq && !kq.ok && kq.code === 'PHIEN_HET_HAN') {
    toast('Phiên hết hạn, đăng nhập lại', 'do');
    dangXuat(true);
    return true;
  }
  return false;
}

/* ============================================================
   HÀNG ĐỢI OFFLINE
   ============================================================ */

function layHangDoi() {
  try { return JSON.parse(docLocal(KHOA.HANG_DOI) || '[]'); } catch (e) { return []; }
}
function luuHangDoi(hd) { luuLocal(KHOA.HANG_DOI, JSON.stringify(hd)); }

function themVaoHangDoi(item) {
  var hd = layHangDoi();
  hd.push(item);
  luuHangDoi(hd);
  veTrangThai();
}

/* ============================================================
   KHAY BAO LỖI — bao máy chủ TỪ CHỐI, chờ công nhân xử lý

   Trước bản 1.5 những bao này bị xoá thẳng khỏi hàng đợi, chỉ báo bằng một dòng
   chữ chạy 2,8 giây. Công nhân đang cầm bao, không nhìn màn hình, là mất hẳn.
   Từ 1.5: bao đó nằm lại đây, có dải đỏ hiện THƯỜNG TRỰC cho tới khi được xử lý,
   và mọi lần bỏ hẳn đều ghi vào nhật ký trên Google Sheets.
   ============================================================ */

function layKhayLoi() {
  try { return JSON.parse(docLocal(KHOA.KHAY_LOI) || '[]'); } catch (e) { return []; }
}
function luuKhayLoi(k) { luuLocal(KHOA.KHAY_LOI, JSON.stringify(k)); }

function themVaoKhayLoi(item, lyDo) {
  var k = layKhayLoi();
  item = item || {};
  item.ly_do = String(lyDo || 'Máy chủ từ chối');
  item.luc = new Date().toISOString().substring(0, 19).replace('T', ' ');
  k.push(item);
  luuKhayLoi(k);
  veTrangThai();
  // Ghi nhật ký ngay để trên Google Sheets có dấu vết, kể cả khi công nhân
  // chưa xử lý gì. Hỏng bước này cũng không được làm hỏng việc chính.
  if (S.ve) {
    goi('apiGhiBaoLoi', [S.ve, item, item.ly_do, 'TREO']).catch(function () {});
  }
}

function veTrangThai() {
  var hd = layHangDoi();
  var kl = layKhayLoi();
  var d = $('daiTrangThai');

  // Khay lỗi ưu tiên cao nhất: đây là số liệu ĐANG CÓ NGUY CƠ MẤT.
  if (kl.length > 0) {
    d.className = 'loi';
    d.textContent = '❗ ' + kl.length + ' bao KHÔNG gửi lên được — bấm để xử lý ngay';
    d.onclick = moKhayLoi;
    d.classList.remove('an');
    return;
  }
  if (hd.length > 0) {
    d.className = 'cho';
    d.textContent = '⏳ ' + hd.length + ' bao chưa gửi được — sẽ tự gửi lại khi có mạng. Bấm để thử ngay.';
    d.onclick = function () { xuLyHangDoi(true); };
    d.classList.remove('an');
  } else if (!navigator.onLine) {
    d.className = 'loi';
    d.textContent = '⚠️ Đang mất mạng — vẫn nhập được, dữ liệu lưu tạm trong máy.';
    d.onclick = null;
    d.classList.remove('an');
  } else {
    d.classList.add('an');
    d.onclick = null;
  }
}

var _dangXuLyHangDoi = false;
function xuLyHangDoi(hienThongBao) {
  if (_dangXuLyHangDoi || !S.ve || !S.nguoiDung) return;
  var hd = layHangDoi();
  if (!hd.length) return;
  if (!navigator.onLine) {
    if (hienThongBao) toast('Vẫn chưa có mạng', 'do');
    return;
  }

  var item = hd[0];

  // CHỐT CHẶN: không gửi dữ liệu của người khác bằng tài khoản đang đăng nhập.
  // Nếu không có bước này, công nhân A để lại hàng đợi rồi công nhân B đăng nhập
  // trên cùng điện thoại thì số liệu của A sẽ bị ghi tên B.
  if (item.ma_nv && item.ma_nv !== S.nguoiDung.ma_nv) {
    if (hienThongBao) {
      alert('Còn ' + hd.length + ' bao chưa gửi là của ' + (item.ten_nguoi || item.ma_nv) + '.\n\n' +
            'Nhờ người đó đăng nhập lại trên chính điện thoại này để gửi lên,\n' +
            'tránh ghi nhầm tên người nhập.');
    }
    return;
  }

  _dangXuLyHangDoi = true;

  goi('apiLuuBao', [S.ve, item])
    .then(function (kq) {
      _dangXuLyHangDoi = false;
      if (kq && kq.ok) {
        // Gửi thành công -> bỏ khỏi hàng đợi
        var l = layHangDoi();
        l.shift();
        luuHangDoi(l);
        veTrangThai();
        if (S.lo && item.ma_lo === S.lo.ma_lo) taiLaiLo(S.lo.ma_lo, true);
        xuLyHangDoi();
      } else if (kq && kq.code === 'PHIEN_HET_HAN') {
        kiemTraPhien(kq);
      } else {
        // Lỗi nghiệp vụ (trùng số bao, lô đã đóng…). Vẫn phải lấy ra khỏi hàng đợi
        // để không kẹt vĩnh viễn — NHƯNG chuyển sang KHAY BAO LỖI chứ không vứt đi.
        // Vứt đi chính là đường mất số liệu đã có từ bản 1.1 tới 1.4.
        var l2 = layHangDoi();
        var bo = l2.shift();
        luuHangDoi(l2);
        themVaoKhayLoi(bo, kq ? kq.error : 'Máy chủ từ chối, không rõ lý do');
        toast('1 bao không gửi được (STT ' + bo.stt_bao + ') — đã đưa vào khay chờ xử lý', 'do');
        xuLyHangDoi();
      }
    })
    .catch(function () {
      _dangXuLyHangDoi = false;
      if (hienThongBao) toast('Chưa gửi được, sẽ thử lại sau', 'do');
    });
}

window.addEventListener('online', function () { veTrangThai(); xuLyHangDoi(); });
window.addEventListener('offline', veTrangThai);
setInterval(function () { xuLyHangDoi(); }, 25000);

/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */

window.addEventListener('load', function () {
  veTrangThai();
  var ve = docLocal(KHOA.VE);
  if (ve) {
    cho(true);
    goi('apiKiemTraVe', [ve])
      .then(function (kq) {
        cho(false);
        if (kq && kq.ok) {
          S.ve = ve;
          S.nguoiDung = kq.data.nguoi_dung;
          S.phien = docLocal(KHOA.PHIEN) || taoPhienMoi();
          vaoApp();
        } else {
          xoaLocal(KHOA.VE);
          batDauDangNhap();
        }
      })
      .catch(function () { cho(false); batDauDangNhap(); });
  } else {
    batDauDangNhap();
  }
});

function taoPhienMoi() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  var s = (S.nguoiDung ? S.nguoiDung.ma_nv : 'NA') + '_' +
          d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
          p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  luuLocal(KHOA.PHIEN, s);
  return s;
}

/* ============================================================
   ĐĂNG NHẬP
   ============================================================ */

function batDauDangNhap() {
  chuyenManHinh('DangNhap');
  an('thanhTren');
  hien('buocChonTen');
  an('buocNhapPin');
  cho(true);
  goi('apiDanhSachNguoiDung', [])
    .then(function (kq) {
      cho(false);
      an('taiNguoiDung');
      if (!kq || !kq.ok) {
        $('taiNguoiDung').textContent = 'Lỗi tải danh sách: ' + (kq ? kq.error : '');
        hien('taiNguoiDung');
        return;
      }
      S.dsNguoiDung = kq.data.ds || [];
      S.pinDoDai = kq.data.pin_do_dai || 4;
      if (kq.data.ten_may) {
        var dsTen = document.querySelectorAll('.logo-ten');
        for (var t = 0; t < dsTen.length; t++) dsTen[t].textContent = kq.data.ten_may;
        $('tieuDeChinh').textContent = kq.data.ten_may;
      }
      if (!S.dsNguoiDung.length) {
        $('taiNguoiDung').textContent =
          'Chưa có người dùng nào. Vào Google Sheets → sheet NGUOI_DUNG để thêm.';
        hien('taiNguoiDung');
        return;
      }
      var h = '';
      // Truyền VỊ TRÍ trong danh sách, không nhét mã NV thẳng vào onclick:
      // mã NV do Andy gõ tay vào sheet, chỉ một dấu nháy đơn là hỏng nút đăng nhập.
      S.dsNguoiDung.forEach(function (u, i) {
        h += '<button class="nut-nguoi" onclick="chonNguoi(' + i + ')">' +
             escapeHtml(u.ten) + '<small>' + escapeHtml(u.ma_nv) + ' · ' +
             nhanVaiTro(u.vai_tro) + '</small></button>';
      });
      $('dsNguoiDung').innerHTML = h;
    })
    .catch(function (e) {
      cho(false);
      $('taiNguoiDung').textContent = 'Không kết nối được máy chủ. Kiểm tra mạng rồi tải lại trang.';
      hien('taiNguoiDung');
    });
}

function nhanVaiTro(v) {
  if (v === 'THONG_KE') return 'Thống kê';
  if (v === 'QUAN_LY') return 'Quản lý';
  return 'Vận hành máy';
}

function chonNguoi(viTri) {
  var u = S.dsNguoiDung[viTri];
  if (!u) return;
  S.maNvDangChon = u.ma_nv;
  S.tenDangChon = u.ten;
  $('tenDangChon').textContent = S.tenDangChon;
  S.pin = '';
  veOPin();
  anLoi('loiPin');
  an('buocChonTen');
  hien('buocNhapPin');
}

function doiNguoi() {
  S.pin = '';
  an('buocNhapPin');
  hien('buocChonTen');
}

function veOPin() {
  var h = '';
  for (var i = 0; i < S.pinDoDai; i++) {
    h += '<span class="' + (i < S.pin.length ? 'day' : '') + '"></span>';
  }
  $('oPin').innerHTML = h;
}

function bamPin(so) {
  if (S.pin.length >= S.pinDoDai) return;
  S.pin += so;
  rung(25);
  veOPin();
  anLoi('loiPin');
  if (S.pin.length === S.pinDoDai) setTimeout(guiPin, 120);
}

function xoaPin() {
  S.pin = S.pin.slice(0, -1);
  veOPin();
  anLoi('loiPin');
}

function guiPin() {
  cho(true);
  goi('apiDangNhap', [S.maNvDangChon, S.pin])
    .then(function (kq) {
      cho(false);
      if (!kq || !kq.ok) {
        S.pin = '';
        veOPin();
        rung([60, 50, 60]);
        hienLoi('loiPin', kq ? kq.error : 'Lỗi không xác định');
        return;
      }
      S.ve = kq.data.ve;
      S.nguoiDung = kq.data.nguoi_dung;
      luuLocal(KHOA.VE, S.ve);
      S.phien = taoPhienMoi();
      vaoApp();
    })
    .catch(function () {
      cho(false);
      S.pin = '';
      veOPin();
      hienLoi('loiPin', 'Không kết nối được máy chủ. Kiểm tra mạng.');
    });
}

function dangXuat(imLang) {
  if (!imLang) {
    var hd = layHangDoi();
    var kl = layKhayLoi();
    if (kl.length > 0) {
      if (!confirm('❗ Còn ' + kl.length + ' bao CHƯA VÀO ĐƯỢC hệ thống.\n' +
                   'Những bao này KHÔNG có trong số liệu và chỉ nằm trong máy này.\n\n' +
                   'Nên xử lý trước khi thoát. Vẫn thoát?')) return;
    } else if (hd.length > 0) {
      if (!confirm('Còn ' + hd.length + ' bao CHƯA GỬI LÊN máy chủ.\n' +
                   'Thoát bây giờ vẫn giữ trong máy này, nhưng phải mở lại app trên chính máy này để gửi.\n\nVẫn thoát?')) return;
    } else if (!confirm('Thoát khỏi app?')) return;
  }
  S.ve = null; S.nguoiDung = null; S.pin = '';
  xoaLocal(KHOA.VE);
  batDauDangNhap();
}

/* ============================================================
   ĐIỀU HƯỚNG
   ============================================================ */

function chuyenManHinh(ten) {
  /* Bản 1.8: rời khỏi màn hình có danh sách bao thì tắt luôn chế độ chọn nhiều.
     Thanh chọn dính đáy màn hình nằm NGOÀI mọi section (xem Index.html), nên để sót
     là nó treo lại trên màn hình khác kèm một danh sách đã chọn không còn nghĩa gì. */
  if (ten !== 'NhapBao' && ten !== 'ChiTietLo') thoatCheDoChon();

  ['DangNhap', 'ChonLo', 'TaoLo', 'NhapBao', 'ThongKe', 'LoDaDong', 'ChiTietLo'].forEach(function (m) {
    an('mh' + m);
  });
  hien('mh' + ten);
  S.manHinh = ten;
  window.scrollTo(0, 0);

  // Nút quay lại chỉ hiện ở màn hình con
  if (ten === 'ChonLo' || ten === 'DangNhap') an('btnQuayLai');
  else hien('btnQuayLai');
}

function quayLai() {

/*
 * Bản khách của chuanMaLo7_ và klBaoTu_ trên máy chủ (bản 1.7).
 *
 * ⚠️ HAI BẢN NÀY PHẢI GIỐNG HỆT NHAU. Máy chủ mới là nơi quyết định; bản này chỉ để
 * hiện ngay cho người vận hành thấy máy sẽ hiểu thế nào TRƯỚC KHI bấm lưu. Sửa một
 * bên mà quên bên kia thì màn hình nói một đằng, sheet ghi một nẻo — xem nợ kỹ thuật
 * số 2 trong TIEN_DO.md, đúng loại lỗi đó đã xảy ra một lần với công thức tỉ lệ.
 */
function chuanMaLo7(raw) {
  var s = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
  var m = /^([A-Z])([0-9]{3,4})([A-Z]{2})?$/.exec(s);
  if (!m) return '';
  var a = String(S.cauHinh.TIEN_TO_A).toUpperCase();
  var b = String(S.cauHinh.TIEN_TO_B).toUpperCase();
  if (m[1] !== a && m[1] !== b) return '';
  var so = (m[2].length === 3) ? ('0' + m[2]) : m[2];
  var chu = m[3] || String(S.cauHinh.MA_LO_HAU_TO || 'LA').toUpperCase();
  return m[1] + so + chu;
}

/*
 * Khối lượng 1 BAO — luật Andy chốt 25/08/2026:
 *   có "," hoặc "."  -> giữ nguyên  ·  không dấu & < 100 -> giữ nguyên
 *   không dấu & >= 100 -> số cuối thành thập phân ("498" -> 49.8)
 * Andy biết và chấp nhận: bao 150 kg gõ "150" sẽ thành 15 kg. Xem klBaoTu_ ở 01_Util.gs.
 */
function klBaoTu(v) {
  if (typeof v === 'number') return v;
  var s = String(v === null || v === undefined ? '' : v).trim().replace(/\s/g, '');
  if (s === '') return NaN;
  var coDauLe = (s.indexOf(',') >= 0 || s.indexOf('.') >= 0);
  var n = soTu(s);
  if (isNaN(n)) return NaN;
  if (coDauLe) return n;
  if (n < 100) return n;
  return n / 10;
}

/*
 * Hiện "✓ Máy hiểu: … kg" ngay dưới ô kg — CHỈ khi máy ĐỔI số người vừa gõ.
 * Gõ "49,8" thì im lặng; gõ "498" hay "150" thì nói ra, vì đó đúng là lúc người gõ
 * cần biết máy hiểu khác cái họ nghĩ.
 */
function echoKlBao(o) {
  var hang = o.parentNode;
  var e = hang.querySelector('.echo-kl');
  if (!e) {
    e = document.createElement('div');
    e.className = 'echo-kl';
    hang.appendChild(e);
  }
  var v = String(o.value || '').trim();
  var n = klBaoTu(v);
  var tho = soTu(v);
  if (v === '' || isNaN(n) || n === tho) { e.textContent = ''; e.classList.remove('hien'); return; }
  e.textContent = '✓ Máy hiểu: ' + n + ' kg';
  e.classList.add('hien');
}

function xemTruocKyHieu() {
  var v = ($('inMaLo').value || '').trim().toUpperCase();
  $('inMaLo').value = v;
  var o = $('xemKyHieu');
  if (!v) {
    o.className = 'xem-ky-hieu';
    o.textContent = 'Ký hiệu sẽ là: —';
    anCanhBaoTrung();
    return;
  }
  // Bản 1.7: hiện thẳng mã ĐẦY ĐỦ máy sẽ ghi, không chỉ ký hiệu A/B.
  var day = chuanMaLo7(v);
  if (day) {
    var kh = (day.charAt(0) === String(S.cauHinh.TIEN_TO_A).toUpperCase()) ? 'A' : 'B';
    o.className = 'xem-ky-hieu dung';
    o.textContent = (day === v ? '✓ Ký hiệu: ' + kh
                               : '✓ Máy hiểu: ' + day + '  ·  ký hiệu ' + kh);
  } else {
    o.className = 'xem-ky-hieu sai';
    o.textContent = '✕ Mã lô phải là 7 ký tự: "' + S.cauHinh.TIEN_TO_A + '" hoặc "' +
                    S.cauHinh.TIEN_TO_B + '" + 4 số + 2 chữ. VD ' +
                    S.cauHinh.TIEN_TO_A + '0753' + (S.cauHinh.MA_LO_HAU_TO || 'LA');
  }
  hoiTrungMaLo(day);
}

/* ============================================================
   CẢNH BÁO TRÙNG MÃ LÔ (bản 1.8 — Andy chốt 29/08/2026)
   ============================================================

   Vì sao phải hỏi máy chủ chứ không tự soi danh sách trong máy:
   lúc mở app, máy chủ chỉ gửi xuống lô ĐANG CHẠY (S.dsLo). Lô ĐÃ ĐÓNG không có ở
   đây — mà gõ trùng một mã lô đã đóng mới là tình huống nguy hiểm nhất, vì người
   vận hành không nhìn thấy lô đó ở bất cứ màn hình nào nên không hề ngờ.

   Ba nguyên tắc, đừng gỡ:
   1. Có ĐỢI TAY DỪNG (_hoTrung) — gõ 7 ký tự mà bắn 7 lượt gọi mạng là phá app.
   2. Có ĐẾM LƯỢT (_luotTrung) — mạng chậm thì câu trả lời của mã cũ có thể về SAU
      câu trả lời của mã mới, và ghi đè lên nó. Trả lời lỗi thời thì bỏ.
   3. KHÔNG khoá nút TẠO. Đây là cảnh báo sớm; apiTaoLo vẫn chặn thật bên trong khoá
      ghi. Mất mạng thì im lặng, mọi thứ chạy y như bản 1.7. */
var _hoTrung = null, _luotTrung = 0, _maDaHoi = '';

function anCanhBaoTrung() {
  var e = $('canhBaoTrungLo');
  if (e) { e.textContent = ''; e.classList.add('an'); }
  _maDaHoi = '';
}

function hoiTrungMaLo(maDay) {
  if (_hoTrung) clearTimeout(_hoTrung);
  if (!maDay) { anCanhBaoTrung(); return; }
  if (maDay === _maDaHoi) return;      // đã hỏi rồi, giữ nguyên câu trả lời đang hiện
  anCanhBaoTrung();

  var luot = ++_luotTrung;
  _hoTrung = setTimeout(function () {
    goi('apiKiemTraMaLo', [S.ve, maDay])
      .then(function (kq) {
        if (luot !== _luotTrung) return;          // trả lời lỗi thời -> bỏ
        if (!kq || !kq.ok || !kq.data) return;
        if (($('inMaLo').value || '').trim().toUpperCase() === '') return;
        _maDaHoi = maDay;
        var e = $('canhBaoTrungLo');
        if (!e) return;
        if (!kq.data.trung) { e.textContent = ''; e.classList.add('an'); return; }

        if (kq.data.trang_thai === 'DA_DONG') {
          e.textContent = '⚠️ Mã ' + kq.data.ma_lo + ' ĐÃ ĐÓNG' +
            (kq.data.tg_dong ? ' ngày ' + String(kq.data.tg_dong).substring(0, 10) : '') +
            ' — không tạo lại được. Báo bộ phận thống kê nếu cần mở lại.';
        } else {
          e.textContent = '⚠️ Mã ' + kq.data.ma_lo + ' ĐANG CHẠY' +
            (kq.data.tg_mo ? ' (mở ' + String(kq.data.tg_mo).substring(0, 10) + ')' : '') +
            ' — hãy chọn lô đó ở danh sách thay vì tạo mới.';
        }
        e.classList.remove('an');
      })
      .catch(function () { /* mất mạng: im lặng, máy chủ vẫn chặn lúc bấm TẠO */ });
  }, 600);
}

function taoLo() {
  var maLo = ($('inMaLo').value || '').trim().toUpperCase();
  var soBao = ($('inSoBaoVao').value || '').trim();
  var klVao = ($('inKlVaoMoi').value || '').trim();
  var ghiChu = ($('inGhiChuLo').value || '').trim();

  anLoi('loiTaoLo');
  if (!maLo) { hienLoi('loiTaoLo', 'Chưa nhập mã lô.'); return; }
  var c = maLo.charAt(0);
  if (c !== String(S.cauHinh.TIEN_TO_A).toUpperCase() &&
      c !== String(S.cauHinh.TIEN_TO_B).toUpperCase()) {
    hienLoi('loiTaoLo', 'Mã lô phải bắt đầu bằng "' + S.cauHinh.TIEN_TO_A +
                        '" hoặc "' + S.cauHinh.TIEN_TO_B + '".');
    return;
  }

  if (klVao) {
    var kv = soLonTu(klVao);
    if (isNaN(kv) || kv <= 0) {
      hienLoi('loiTaoLo', 'Không đọc được khối lượng đầu vào "' + klVao + '".\n' +
                          'Gõ số thường (VD 1000) hoặc có dấu phân cách nghìn (VD 1.000).');
      return;
    }
  }

  cho(true);
  goi('apiTaoLo', [S.ve, maLo, soBao, ghiChu, klVao])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiTaoLo', kq ? kq.error : 'Lỗi'); return; }
      toast('Đã tạo lô ' + kq.data.ma_lo, 'xanh');
      moLo(kq.data.ma_lo);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiTaoLo', 'Mất mạng — không tạo được lô mới. Lô mới BẮT BUỘC phải có mạng.');
    });
}

/* ============================================================
   CÁC DÒNG NHẬP BAO (nhập nhiều bao cùng lúc)
   ============================================================ */

function dsDong() {
  return Array.prototype.slice.call(document.querySelectorAll('#dsDongNhap .dong-nhap'));
}

function htmlDongNhap(i, stt, kl) {
  return '<div class="dong-nhap">' +
           '<div class="so-dong">' + (i + 1) + '</div>' +
           '<input class="o-stt" type="text" inputmode="numeric" pattern="[0-9]*" ' +
             'autocomplete="off" placeholder="Số bao" value="' +
             (stt === undefined || stt === null ? '' : stt) + '">' +
           '<input class="o-kl" type="text" inputmode="decimal" ' +
             'oninput="echoKlBao(this)" ' +
             'autocomplete="off" placeholder="kg" value="' +
             (kl === undefined || kl === null ? '' : kl) + '">' +
           '<button class="bo-dong" onclick="boDongNhap(this)" aria-label="Bỏ dòng">✕</button>' +
         '</div>';
}

/** Dựng lại toàn bộ các dòng (mất nội dung đang gõ) — chỉ dùng khi mở lô / sau khi lưu xong. */
function dungLaiDongNhap(soDong) {
  var h = '';
  for (var i = 0; i < (soDong || 1); i++) h += htmlDongNhap(i);
  $('dsDongNhap').innerHTML = h;
  capNhatSoDong();
}

function danhSoLaiDong() {
  dsDong().forEach(function (el, i) { el.querySelector('.so-dong').textContent = i + 1; });
}

function capNhatSoDong() {
  var n = dsDong().length;
  var max = Number(S.cauHinh.SO_BAO_MOI_LAN) || 20;
  $('demDongNhap').textContent = n;
  $('btnThemDong').disabled = (n >= max);
  $('btnThemDong').textContent = (n >= max)
    ? ('Đã đủ ' + max + ' dòng — bấm LƯU BAO')
    : '＋ THÊM 1 DÒNG';
  // Viền trái các dòng mang màu của loại đang chọn
  var mau = S.loaiDangChon ? ('var(--loai' + S.loaiDangChon + ')') : '';
  dsDong().forEach(function (el) { el.style.setProperty('--mau-loai', mau); });
}

/** Thêm 1 dòng, số bao tự nối tiếp dòng trước. Trả về thẻ vừa thêm, hoặc null nếu đã đủ. */
function themDongNhap() {
  var ds = dsDong();
  var max = Number(S.cauHinh.SO_BAO_MOI_LAN) || 20;
  if (ds.length >= max) { toast('Mỗi lần chỉ nhập tối đa ' + max + ' bao', 'do'); return null; }

  var sttMoi = '';
  if (ds.length) {
    var truoc = soTu(ds[ds.length - 1].querySelector('.o-stt').value);
    if (!isNaN(truoc)) sttMoi = truoc + 1;
  }
  var tam = document.createElement('div');
  tam.innerHTML = htmlDongNhap(ds.length, sttMoi, '');
  var node = tam.firstChild;
  $('dsDongNhap').appendChild(node);
  capNhatSoDong();
  return node;
}

function boDongNhap(btn) {
  var ds = dsDong();
  if (ds.length <= 1) {           // còn 1 dòng thì chỉ xoá nội dung, luôn giữ lại 1 dòng
    ds[0].querySelector('.o-stt').value = '';
    ds[0].querySelector('.o-kl').value = '';
    return;
  }
  btn.parentNode.parentNode.removeChild(btn.parentNode);
  danhSoLaiDong();
  capNhatSoDong();
}

var _luotMoLo = 0;

function taiLaiLo(maLo, imLang) {
  var luot = ++_luotMoLo;
  if (!imLang) cho(true);
  goi('apiMoLo', [S.ve, maLo, S.phien])
    .then(function (kq) {
      if (luot !== _luotMoLo) return;   // phản hồi lỗi thời -> bỏ, tránh ghi đè danh sách bao
      if (!imLang) cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { toast(kq ? kq.error : 'Lỗi', 'do'); return; }

      S.lo = kq.data.lo;
      S.dsBao = kq.data.ds_bao;

      // Bao đã bị xoá / đã chốt thì bỏ khỏi danh sách đang tích, nếu không thanh đếm
      // sẽ nói một con số không còn thật.
      if (S.cheDoChon) {
        var conSong = {};
        S.dsBao.forEach(function (b) {
          if (b.sua_duoc && S.daChon[String(b.id)]) conSong[String(b.id)] = true;
        });
        S.daChon = conSong;
        capNhatDemChon();
      }
      S.goiYStt = kq.data.goi_y_stt;
      S.duocSuaLo = !!kq.data.duoc_sua_lo;
      S.laQuanLy = !!kq.data.la_quan_ly;
      S.ketQua = kq.data.ket_qua || null;

      // Màn hình CHI TIẾT LÔ dùng chung đúng dữ liệu này (bản 1.6) — nhờ vậy mọi hộp
      // thoại sửa bao / sửa mã lô / xoá lô chạy được ở cả hai màn hình mà không sửa gì.
      if (S.manHinh === 'ChiTietLo') { veChiTietLo(); return; }

      if (S.duocSuaLo) hien('khuQuanLyLo'); else an('khuQuanLyLo');

      $('loMa').textContent = S.lo.ma_lo;
      $('loPhu').textContent = 'Ký hiệu ' + S.lo.ky_hieu +
        (S.lo.so_bao_vao !== null ? ' · vào ' + S.lo.so_bao_vao + ' bao' : '') +
        (S.lo.kl_vao !== null && S.lo.kl_vao !== undefined ? ' · ' + S.lo.kl_vao + ' kg' : '');

      ['1', '2', '3'].forEach(function (l) {
        $('nhanLoai' + l).textContent = S.lo.ky_hieu + l;
      });

      veDanhSachBao();
      veKetQua(S.ketQua);   // bảng tỉ lệ đi kèm apiMoLo, không tốn lượt gọi thứ hai
      if (S.loaiDangChon) datGoiYStt(S.loaiDangChon, false);
    })
    .catch(function () {
      if (!imLang) cho(false);
      toast('Mất mạng — vẫn nhập được, dữ liệu chờ gửi', 'do');
      veTrangThai();
    });
}

/*
 * Một dòng bao. Dùng chung cho màn hình NHẬP LIỆU và màn hình CHI TIẾT LÔ (bản 1.6);
 * cả hai đều đọc từ S.dsBao nên chỉ số i truyền vào moSuaBao là như nhau.
 *
 * Với quản lý, máy chủ trả sua_duoc = true cho MỌI bao (kể cả bao đã chốt của người
 * khác, kể cả lô đã đóng) — nên nút ✎ hiện ra, và hộp thoại sẽ bắt gõ lý do.
 */
function htmlDongBao(b, i) {
  var khoa = !b.sua_duoc;
  var moi = (S.vuaLuu && S.vuaLuu[String(b.id)]) ? ' vua-luu' : '';
  var daTich = !!(S.daChon && S.daChon[String(b.id)]);

  /*
   * Bản 1.8: ở chế độ chọn nhiều, nút ✎ nhường chỗ cho ô tích.
   * Bao đã khoá 🔒 KHÔNG có ô tích — không bao giờ chọn phải bao không xoá được, nên
   * người ta không mất công tích rồi mới bị máy chủ từ chối cả loạt. Máy chủ vẫn soát
   * lại từng bao (apiXoaNhieuBao): ẩn nút không bao giờ được coi là phân quyền.
   */
  var oPhai;
  if (S.cheDoChon) {
    oPhai = khoa
      ? '<div class="khoa-icon">🔒</div>'
      : '<label class="o-tich-bao"><input type="checkbox"' + (daTich ? ' checked' : '') +
        ' onchange="tichBao(this, \'' + escapeHtml(String(b.id)) + '\')"></label>';
  } else {
    oPhai = khoa
      ? '<div class="khoa-icon">🔒</div>'
      : '<button class="sua" onclick="moSuaBao(' + i + ')">✎</button>';
  }

  return '<div class="dong-bao' + (khoa ? ' khoa' : '') + moi +
         (daTich ? ' da-tich' : '') +
         '" data-loai="' + escapeHtml(b.loai) + '">' +
           '<div class="nhom">' + escapeHtml(String(b.ky_hieu) + String(b.loai)) + '</div>' +
           '<div class="giua"><div class="stt">Bao ' + escapeHtml(b.stt_bao) + '</div>' +
             '<div class="meta">' + escapeHtml(b.ten_nguoi_nhap) + ' · ' +
             escapeHtml(String(b.tg_nhap).substring(5, 16)) +
             (b.trang_thai === 'DA_CHOT' ? ' · đã chốt' : '') + '</div></div>' +
           '<div class="kl">' + escapeHtml(b.khoi_luong) + '</div>' +
           oPhai +
         '</div>';
}

/* ============================================================
   CHỌN NHIỀU BAO & XOÁ HÀNG LOẠT (bản 1.8 — Andy chốt 29/08/2026)
   ============================================================

   Đây là thao tác phá dữ liệu mạnh nhất trong app. Bốn hàng rào, đừng gỡ cái nào:
     1. Phải bật chế độ chọn mới thấy ô tích — không có nút xoá nào nằm sẵn chờ bấm nhầm.
     2. Bao đã khoá không tích được.
     3. Hộp xác nhận in RÕ từng bao sắp mất, kèm ô tích, nút chỉ sáng sau khi tích.
     4. Máy chủ soát lại tất cả và theo lối ĐƯỢC ĂN CẢ NGÃ VỀ KHÔNG.
   ============================================================ */

function veLaiDsBao() {
  if (S.manHinh === 'ChiTietLo') veChiTietLo(); else veDanhSachBao();
}

function doiCheDoChon() {
  S.cheDoChon = !S.cheDoChon;
  S.daChon = {};
  if (S.cheDoChon) hien('thanhChonNhieu'); else an('thanhChonNhieu');
  document.body.classList.toggle('co-thanh-chon', S.cheDoChon);
  ['btnChonNhieu', 'btnCtChonNhieu'].forEach(function (id) {
    var e = $(id);
    if (e) e.textContent = S.cheDoChon ? '✕ Thôi chọn' : '☑ Chọn nhiều';
  });
  capNhatDemChon();
  veLaiDsBao();
}

function thoatCheDoChon() {
  if (!S.cheDoChon) return;
  S.cheDoChon = false;
  S.daChon = {};
  an('thanhChonNhieu');
  document.body.classList.remove('co-thanh-chon');
  ['btnChonNhieu', 'btnCtChonNhieu'].forEach(function (id) {
    var e = $(id);
    if (e) e.textContent = '☑ Chọn nhiều';
  });
}

function tichBao(o, id) {
  if (o.checked) S.daChon[String(id)] = true;
  else delete S.daChon[String(id)];
  var hang = o.parentNode && o.parentNode.parentNode;
  if (hang) { if (o.checked) hang.classList.add('da-tich'); else hang.classList.remove('da-tich'); }
  capNhatDemChon();
}

function dsIdDaChon() {
  return Object.keys(S.daChon || {});
}

function capNhatDemChon() {
  var ds = dsIdDaChon();
  var kl = 0;
  (S.dsBao || []).forEach(function (b) {
    if (S.daChon[String(b.id)]) kl += Number(b.khoi_luong) || 0;
  });
  var e = $('demDaChon');
  if (e) {
    e.textContent = ds.length
      ? ('Đã chọn ' + ds.length + ' bao · ' + tron2(kl) + ' kg')
      : 'Chưa chọn bao nào';
  }
  var n = $('btnXoaDaChon');
  if (n) n.disabled = (ds.length === 0);
}

function moHopXoaNhieu() {
  var ds = dsIdDaChon();
  if (!ds.length) { toast('Chưa chọn bao nào', 'do'); return; }
  if (ds.length > 50) {
    toast('Mỗi lần chỉ xoá được tối đa 50 bao — bỏ bớt rồi làm nhiều lần', 'do');
    return;
  }

  var kl = 0, dong = '', coKhoa = false;
  (S.dsBao || []).forEach(function (b) {
    if (!S.daChon[String(b.id)]) return;
    kl += Number(b.khoi_luong) || 0;
    if (b.trang_thai === 'DA_CHOT') coKhoa = true;
    dong += '<div class="dong-xem-truoc">' +
              escapeHtml(String(b.ky_hieu) + String(b.loai)) + ' · bao ' +
              escapeHtml(b.stt_bao) + ' · ' + escapeHtml(b.khoi_luong) + ' kg' +
            '</div>';
  });

  $('tomTatXoaNhieu').textContent = 'Sắp xoá ' + ds.length + ' bao · ' + tron2(kl) + ' kg.';
  $('dsXoaNhieu').innerHTML = dong;
  $('lyDoXoaNhieu').value = '';
  // Ô lý do chỉ có nghĩa với quản lý xoá số liệu đã khoá. Máy chủ mới là nơi bắt buộc.
  if (S.laQuanLy && coKhoa) hien('khuLyDoXoaNhieu'); else an('khuLyDoXoaNhieu');
  $('tichXoaNhieu').checked = false;
  $('btnXacNhanXoaNhieu').disabled = true;
  anLoi('loiXoaNhieu');
  hien('lopXoaNhieu');
}

function dongHopXoaNhieu(e) {
  if (e && e.target && e.target.id !== 'lopXoaNhieu') return;
  an('lopXoaNhieu');
}

function doiTichXoaNhieu() {
  var t = $('tichXoaNhieu').checked;
  $('btnXacNhanXoaNhieu').disabled = !t;
  if (t) anLoi('loiXoaNhieu');
}

function xacNhanXoaNhieu() {
  var ds = dsIdDaChon();
  if (!ds.length) return;
  anLoi('loiXoaNhieu');
  if (!$('tichXoaNhieu').checked) {
    hienLoi('loiXoaNhieu', 'Hãy tích vào ô xác nhận trước khi xoá.');
    rung([60, 50, 60]);
    return;
  }

  cho(true);
  goi('apiXoaNhieuBao', [S.ve, ds, $('lyDoXoaNhieu').value])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiXoaNhieu', kq ? kq.error : 'Lỗi'); return; }
      an('lopXoaNhieu');
      thoatCheDoChon();
      toast('✔ Đã xoá ' + kq.data.da_xoa + ' bao · ' + kq.data.tong_kl + ' kg', 'xanh');
      taiLaiLo(S.lo.ma_lo, true);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiXoaNhieu', 'Mất mạng — xoá được khi có mạng trở lại.');
    });
}

/*
 * Danh sách bao GOM THEO CA (bản 1.7 — Andy chốt 25/08/2026, ý tưởng 3 / 3C).
 *
 * ⚠️ ĐỌC KỸ CHỖ NÀY TRƯỚC KHI SỬA — khoá gom là cặp (phien, trang_thai), KHÔNG phải
 * một mã ca riêng. Lý do: hệ thống KHÔNG hề ghi "lần chốt ca thứ mấy" lên từng bao —
 * apiChotCa chỉ đặt trang_thai = DA_CHOT (xem datTrangThaiBao_ trong 01_Util.gs).
 *
 * Cặp (phien, trang_thai) tách ĐÚNG trong mọi tình huống thật:
 *   - người khác nhập            -> phien khác  (phien = mã NV + giờ đăng nhập)
 *   - lần đăng nhập khác         -> phien khác
 *   - chốt ca xong nhập tiếp
 *     trong CÙNG lần đăng nhập   -> trang_thai tách hai khối ra
 *
 * CHỖ DUY NHẤT nó gộp nhầm: chốt ca HAI LẦN trong cùng một lần đăng nhập, cùng một
 * lô — hai khối đó đều mang DA_CHOT nên nhập làm một khối. Muốn tách tuyệt đối thì
 * phải ghi thêm mốc thời gian chốt lên từng bao, tức THÊM CỘT ở sheet BAO. Chưa làm.
 *
 * Trong mỗi khối: bao CÙNG LOẠI nằm liền nhau, rồi theo số bao tăng dần.
 * Giữa các khối: khối có bao mới nhất lên trên, để khối đang nhập luôn ở đầu màn hình.
 *
 * ⚠️ Chỉ số truyền cho htmlDongBao phải là VỊ TRÍ GỐC trong S.dsBao, KHÔNG phải vị
 * trí sau khi sắp xếp — nút ✎ dùng đúng chỉ số này để biết sửa bao nào. Sắp xếp rồi
 * đánh số lại là sửa nhầm bao, mà nhầm ở đây thì không có gì báo cho biết.
 */
function htmlDsBaoTheoCa(dsBao) {
  if (!dsBao || !dsBao.length) return '';

  var khoi = [], theoKhoa = {};

  dsBao.forEach(function (b, i) {
    var k = String(b.phien || '') + '|' + String(b.trang_thai || '');
    if (!theoKhoa[k]) {
      theoKhoa[k] = {
        ds: [], kl: 0,
        ten: b.ten_nguoi_nhap || b.nguoi_nhap || '—',
        daChot: (String(b.trang_thai).toUpperCase() === 'DA_CHOT'),
        tgDau: String(b.tg_nhap || ''), tgCuoi: String(b.tg_nhap || '')
      };
      khoi.push(theoKhoa[k]);
    }
    var o = theoKhoa[k];
    o.ds.push({ b: b, i: i });          // i = vị trí GỐC, xem ghi chú trên
    o.kl += Number(b.khoi_luong) || 0;
    var tg = String(b.tg_nhap || '');
    if (tg) {
      if (!o.tgDau  || tg < o.tgDau)  o.tgDau  = tg;
      if (!o.tgCuoi || tg > o.tgCuoi) o.tgCuoi = tg;
    }
  });

  khoi.sort(function (a, b) { return String(b.tgCuoi).localeCompare(String(a.tgCuoi)); });

  var h = '';
  khoi.forEach(function (k) {
    k.ds.sort(function (x, y) {
      var lx = String(x.b.loai), ly = String(y.b.loai);
      if (lx !== ly) return lx < ly ? -1 : 1;
      return (Number(x.b.stt_bao) || 0) - (Number(y.b.stt_bao) || 0);
    });

    var gio = gioNgan(k.tgDau) + (gioNgan(k.tgCuoi) !== gioNgan(k.tgDau)
                                    ? ' → ' + gioNgan(k.tgCuoi) : '');
    h += '<div class="dau-ca' + (k.daChot ? ' da-chot' : '') + '">' +
           '<div class="dau-ca-ten">' + (k.daChot ? '🔒&nbsp;' : '▶&nbsp;') + escapeHtml(k.ten) +
             '<span class="dau-ca-tt">' + (k.daChot ? 'đã chốt ca' : 'đang nhập') + '</span>' +
           '</div>' +
           '<div class="dau-ca-phu">' + escapeHtml(gio) + ' · ' + k.ds.length +
             ' bao · ' + tron2(k.kl) + ' kg</div>' +
         '</div>';

    k.ds.forEach(function (x) { h += htmlDongBao(x.b, x.i); });
  });
  return h;
}

/* "2026-08-25 06:12:33" -> "08-25 06:12". Cùng cách cắt đã dùng ở htmlDongBao. */
function gioNgan(tg) {
  return String(tg || '').substring(5, 16);
}

function veDanhSachBao() {
  // Gộp thêm các bao đang nằm trong hàng đợi của lô này
  var hd = layHangDoi().filter(function (i) { return S.lo && i.ma_lo === S.lo.ma_lo; });

  /*
   * Bao còn trong hàng đợi hoặc trong khay lỗi thì CHƯA có trong số liệu máy chủ,
   * nên bảng tỉ lệ ngay bên dưới đang thiếu đúng phần đó.
   *
   * Trước bản 1.6, chỗ này được xử bằng cách CHẶN không cho xem kết quả. Nay bảng nằm
   * thường trực trên màn hình nhập nên không chặn được nữa — phải nói thẳng ra.
   * Chốt ca và đóng lô thì VẪN chặn như cũ (xem chanVaoKhayLoi).
   */
  var kl = layKhayLoi().filter(function (i) { return S.lo && i.ma_lo === S.lo.ma_lo; });
  if (hd.length || kl.length) {
    var ms = [];
    if (hd.length) ms.push(hd.length + ' bao chưa gửi lên máy chủ');
    if (kl.length) ms.push(kl.length + ' bao chưa vào được hệ thống');
    $('canhBaoTamTinh').textContent =
      '⚠️ Còn ' + ms.join(' và ') + ' — tỉ lệ bên dưới CHƯA tính phần này.';
    hien('canhBaoTamTinh');
  } else {
    an('canhBaoTamTinh');
  }

  var tongBao = S.dsBao.length + hd.length;
  var tongKl = 0;
  S.dsBao.forEach(function (b) { tongKl += Number(b.khoi_luong) || 0; });
  hd.forEach(function (b) { tongKl += Number(b.khoi_luong) || 0; });

  $('loSoBao').textContent = tongBao;
  $('demBao').textContent = tongBao;

  var h = '';

  hd.forEach(function (b) {
    h += '<div class="dong-bao khoa" data-loai="' + escapeHtml(b.loai) + '">' +
           '<div class="nhom">' + escapeHtml((S.lo ? S.lo.ky_hieu : '') + b.loai) + '</div>' +
           '<div class="giua"><div class="stt">Bao ' + escapeHtml(b.stt_bao) + '</div>' +
             '<div class="meta">⏳ chờ gửi lên máy chủ</div></div>' +
           '<div class="kl">' + escapeHtml(b.khoi_luong) + '</div>' +
           '<div class="khoa-icon">⏳</div>' +
         '</div>';
  });

  // Truyền VỊ TRÍ trong danh sách, không ghép giá trị vào onclick — cùng nguyên tắc
  // đã áp cho nút chọn tên và nút chọn lô ở bản 1.2.
  h += htmlDsBaoTheoCa(S.dsBao);

  if (!tongBao) {
    h = '<p class="ghi-chu-mo">Chưa có bao nào. Chọn Loại rồi nhập khối lượng.</p>';
  }
  $('dsBao').innerHTML = h;
}

function chonLoai(l) {
  S.loaiDangChon = l;
  rung(25);
  capNhatNutLoai();
  dungLaiDongNhap(1);       // đổi loại thì dải số bao khác hẳn, làm lại từ 1 dòng
  datGoiYStt(l, true);
  anLoi('loiNhapBao');
  an('canhBaoNhapBao');
  var d = dsDong()[0];
  if (d) setTimeout(function () { d.querySelector('.o-kl').focus(); }, 60);
}

function capNhatNutLoai() {
  var ds = document.querySelectorAll('.nut-loai');
  for (var i = 0; i < ds.length; i++) {
    if (ds[i].getAttribute('data-loai') === S.loaiDangChon) ds[i].classList.add('chon');
    else ds[i].classList.remove('chon');
  }
}

/**
 * Đặt gợi ý số bao cho loại đang chọn.
 * Có tính cả các bao đang nằm trong hàng đợi offline, nếu không thì khi mất mạng
 * mà đổi loại qua lại sẽ gợi ý trùng số bao.
 */
function datGoiYStt(l, ep) {
  var g = (S.goiYStt && S.goiYStt[l] !== undefined && S.goiYStt[l] !== null)
            ? Number(S.goiYStt[l]) : null;

  var kh = S.lo ? S.lo.ky_hieu : '';
  layHangDoi().forEach(function (i) {
    if (i.loai !== l) return;
    if (i.ky_hieu && kh && i.ky_hieu !== kh) return;
    if (!i.ky_hieu && i.ma_lo !== (S.lo ? S.lo.ma_lo : '')) return;
    var tiep = Number(i.stt_bao) + 1;
    if (g === null || tiep > g) g = tiep;
  });

  var ds = dsDong();
  if (!ds.length) return;
  var o = ds[0].querySelector('.o-stt');
  // Chỉ ghi đè khi ĐỔI LOẠI (ep = true). Lúc tải lại lô thì không được đụng vào
  // số công nhân đang gõ dở.
  if (ep || !String(o.value).trim()) o.value = (g === null) ? '' : g;

  for (var i = 1; i < ds.length; i++) {
    var truoc = soTu(ds[i - 1].querySelector('.o-stt').value);
    var oi = ds[i].querySelector('.o-stt');
    if (ep || !String(oi.value).trim()) oi.value = isNaN(truoc) ? '' : (truoc + 1);
  }
}

function luuBao() {
  if (S.dangGui) return;
  anLoi('loiNhapBao');
  an('canhBaoNhapBao');

  if (!S.lo) { hienLoi('loiNhapBao', 'Chưa mở lô.'); return; }
  if (!S.loaiDangChon) {
    hienLoi('loiNhapBao', 'Chưa chọn Loại 1 / 2 / 3.');
    rung([60, 50, 60]);
    return;
  }

  var ds = dsDong();
  ds.forEach(function (el) {
    el.querySelector('.o-stt').classList.remove('sai');
    el.querySelector('.o-kl').classList.remove('sai');
  });

  /* --- Soát từng dòng ngay tại điện thoại, báo rõ SAI Ở DÒNG NÀO --- */
  var dong = [], loi = '';
  for (var i = 0; i < ds.length; i++) {
    var oS = ds[i].querySelector('.o-stt');
    var oK = ds[i].querySelector('.o-kl');
    var vS = String(oS.value || '').trim();
    var vK = String(oK.value || '').trim();

    if (!vS && !vK) continue;                    // dòng để trống hoàn toàn -> bỏ qua

    var sttN = soTu(vS);
    if (isNaN(sttN) || sttN <= 0 || sttN !== Math.floor(sttN)) {
      oS.classList.add('sai');
      loi = 'Dòng ' + (i + 1) + ': số bao phải là số nguyên dương.';
      break;
    }
    var klN = klBaoTu(vK);          // bản 1.7 — xem klBaoTu
    if (isNaN(klN)) {
      oK.classList.add('sai');
      loi = 'Dòng ' + (i + 1) + ' (bao ' + sttN + '): chưa nhập khối lượng.';
      break;
    }
    if (klN < S.cauHinh.KL_MIN || klN > S.cauHinh.KL_MAX) {
      oK.classList.add('sai');
      loi = 'Dòng ' + (i + 1) + ' (bao ' + sttN + '): ' + klN + ' kg ngoài khoảng ' +
            S.cauHinh.KL_MIN + '–' + S.cauHinh.KL_MAX + ' kg. Kiểm tra lại dấu thập phân.';
      break;
    }
    dong.push({ el: ds[i], stt_bao: sttN, khoi_luong: klN, client_id: taoClientId() });
  }

  if (loi) { hienLoi('loiNhapBao', loi); rung([60, 50, 60]); return; }
  if (!dong.length) { hienLoi('loiNhapBao', 'Chưa nhập dòng nào.'); return; }

  // Trùng ngay trong danh sách vừa gõ — bắt tại chỗ, khỏi tốn một lượt gọi mạng
  var thay = {};
  for (var k = 0; k < dong.length; k++) {
    if (thay[dong[k].stt_bao] !== undefined) {
      dong[k].el.querySelector('.o-stt').classList.add('sai');
      dong[thay[dong[k].stt_bao]].el.querySelector('.o-stt').classList.add('sai');
      hienLoi('loiNhapBao', 'Số bao ' + dong[k].stt_bao + ' bị gõ 2 lần (dòng ' +
              (thay[dong[k].stt_bao] + 1) + ' và dòng ' + (k + 1) + ').');
      rung([60, 50, 60]);
      return;
    }
    thay[dong[k].stt_bao] = k;
  }

  var danhSach = dong.map(function (d) {
    return { stt_bao: d.stt_bao, khoi_luong: d.khoi_luong, client_id: d.client_id };
  });

  S.dangGui = true;
  $('btnLuuBao').disabled = true;

  goi('apiLuuNhieuBao', [S.ve, {
    ma_lo: S.lo.ma_lo, loai: S.loaiDangChon, phien: S.phien, danh_sach: danhSach
  }])
    .then(function (kq) {
      S.dangGui = false;
      $('btnLuuBao').disabled = false;
      if (kiemTraPhien(kq)) return;

      if (!kq || !kq.ok) {
        hienLoi('loiNhapBao', kq ? kq.error : 'Lỗi không xác định');
        rung([60, 50, 60]);
        return;
      }

      // Cập nhật tại chỗ, KHÔNG gọi lại máy chủ -> cả mẻ chỉ tốn 1 lượt mạng.
      // Đánh dấu mẻ vừa lưu: từ bản 1.7 danh sách gom theo CA nên bao mới KHÔNG còn
      // nằm ở đầu danh sách nữa, phải tô sáng thì người vận hành mới tìm thấy nó.
      S.vuaLuu = {};
      (kq.data.da_luu || []).forEach(function (b) {
        S.vuaLuu[String(b.id)] = true;
        S.dsBao.unshift({
          id: b.id, loai: b.loai, ky_hieu: b.ky_hieu,
          stt_bao: b.stt_bao, khoi_luong: b.khoi_luong,
          trang_thai: 'DANG_NHAP',
          nguoi_nhap: S.nguoiDung.ma_nv,
          ten_nguoi_nhap: kq.data.ten_nguoi_nhap || S.nguoiDung.ten,
          tg_nhap: b.tg_nhap || '', phien: S.phien, sua_duoc: true
        });
      });

      sauKhiLuu(kq.data.da_luu.length, kq.data.tong_kl, kq.data.goi_y_stt_tiep,
                kq.data.canh_bao, kq.data.bo_qua_trung);
      veDanhSachBao();
      capNhatKetQuaTaiCho();   // giữ đúng 1 lượt mạng cho cả mẻ — xem hàm này
    })
    .catch(function () {
      // Mất mạng -> đẩy từng dòng vào hàng đợi, KHÔNG bắt công nhân gõ lại.
      S.dangGui = false;
      $('btnLuuBao').disabled = false;
      var tong = 0;
      danhSach.forEach(function (d) {
        themVaoHangDoi({
          ma_lo: S.lo.ma_lo, ky_hieu: S.lo.ky_hieu, loai: S.loaiDangChon,
          stt_bao: d.stt_bao, khoi_luong: d.khoi_luong,
          phien: S.phien, client_id: d.client_id,
          ma_nv: S.nguoiDung.ma_nv, ten_nguoi: S.nguoiDung.ten
        });
        tong += d.khoi_luong;
      });
      sauKhiLuu(danhSach.length, Math.round(tong * 10) / 10,
                danhSach[danhSach.length - 1].stt_bao + 1, '', 0);
      veDanhSachBao();
      toast('Mất mạng — đã lưu tạm ' + danhSach.length + ' bao trong máy', 'do');
    });
}

function sauKhiLuu(soBao, tongKl, sttTiep, canhBao, boQua) {
  rung(45);
  if (canhBao) {
    $('canhBaoNhapBao').textContent = '⚠️ ' + canhBao;
    hien('canhBaoNhapBao');
  }
  if (boQua) {
    toast('Bỏ qua ' + boQua + ' bao đã gửi lên trước đó', 'do');
  } else {
    toast('✔ Đã lưu ' + soBao + ' bao — ' + tongKl + ' kg', 'xanh');
  }

  if (S.goiYStt && S.loaiDangChon) S.goiYStt[S.loaiDangChon] = sttTiep;

  // Về lại đúng 1 dòng trống, số bao đã điền sẵn -> gõ tiếp mẻ sau ngay
  dungLaiDongNhap(1);
  var d = dsDong()[0];
  if (d) {
    d.querySelector('.o-stt').value = (sttTiep === null || sttTiep === undefined) ? '' : sttTiep;
    setTimeout(function () { d.querySelector('.o-kl').focus(); }, 60);
  }
}

function taoClientId() {
  return 'c' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
}

/*
 * Enter ở ô khối lượng = xuống dòng mới (số bao tự tăng), KHÔNG lưu ngay.
 * Nhờ vậy công nhân gõ liền mạch: kg → Enter → kg → Enter … rồi bấm LƯU BAO một lần.
 * Đủ số dòng tối đa rồi thì Enter mới lưu luôn.
 */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || S.manHinh !== 'NhapBao') return;
  var el = document.activeElement;
  if (!el || !el.classList || !el.classList.contains('o-kl')) return;
  e.preventDefault();
  var node = themDongNhap();
  if (node) node.querySelector('.o-kl').focus();
  else luuBao();
});

/* ============================================================
   SỬA / XOÁ BAO
   ============================================================ */

function moSuaBao(viTri) {
  var bao = S.dsBao[viTri];
  if (!bao) return;
  if (!bao.sua_duoc) { toast('Bao này đã khoá', 'do'); return; }

  S.baoDangSua = bao;
  $('tieuDeSua').textContent = 'Sửa bao ' + bao.ky_hieu + bao.loai + ' — STT ' + bao.stt_bao;
  $('suaStt').value = bao.stt_bao;
  $('suaKl').value = bao.khoi_luong;

  // Bản 1.8: ô chọn loại. Nhãn hiện đúng ký hiệu của lô (A1/A2/A3 hoặc B1/B2/B3).
  S.loaiSuaGoc = String(bao.loai);
  S.loaiSuaDangChon = String(bao.loai);
  ['1', '2', '3'].forEach(function (l) {
    var e = $('nhanSuaLoai' + l);
    if (e) e.textContent = String(bao.ky_hieu) + l;
  });
  capNhatNutLoaiSua();

  /* Bản 1.6: quản lý sửa/xoá được cả số liệu đã khoá, nhưng máy chủ bắt gõ lý do.
     Ô này chỉ hiện với quản lý — công nhân không bao giờ thấy. Máy chủ mới là nơi
     quyết định lý do có bắt buộc hay không (batLyDo_), giao diện chỉ dọn chỗ để gõ. */
  $('lyDoBao').value = '';
  if (S.laQuanLy) hien('khuLyDoBao'); else an('khuLyDoBao');

  anLoi('loiSua');
  hien('lopPhu');
}

function dongSuaBao(e) {
  if (e && e.target && e.target.id !== 'lopPhu') return;
  an('lopPhu');
  S.baoDangSua = null;
}

/*
 * Chọn loại trong hộp SỬA bao (bản 1.8).
 *
 * Đổi loại là chuyển bao sang một dãy số bao khác — số bao đang gõ có thể đã có người
 * dùng bên nhóm mới. Màn hình nói trước điều đó; máy chủ mới là nơi chặn thật, và nó
 * BÁO LỖI bắt gõ số khác chứ không tự đổi số ngầm (Andy chốt 29/08/2026).
 */
function chonLoaiSua(l) {
  S.loaiSuaDangChon = String(l);
  rung(20);
  capNhatNutLoaiSua();
  anLoi('loiSua');
}

function capNhatNutLoaiSua() {
  var ds = document.querySelectorAll('.nut-loai-sua');
  for (var i = 0; i < ds.length; i++) {
    if (ds[i].getAttribute('data-loai') === String(S.loaiSuaDangChon)) ds[i].classList.add('chon');
    else ds[i].classList.remove('chon');
  }
  var cb = $('canhBaoDoiLoai');
  if (!cb) return;
  var bao = S.baoDangSua;
  if (bao && String(S.loaiSuaDangChon) !== String(S.loaiSuaGoc)) {
    cb.textContent = '⚠️ Đổi loại ' + bao.ky_hieu + S.loaiSuaGoc + ' → ' +
                     bao.ky_hieu + S.loaiSuaDangChon +
                     '. Số bao được đánh riêng cho từng loại — nếu số ' + bao.stt_bao +
                     ' đã có ở nhóm mới thì phải gõ số khác.';
    cb.classList.remove('an');
  } else {
    cb.textContent = '';
    cb.classList.add('an');
  }
}

function luuSuaBao() {
  if (!S.baoDangSua) return;
  anLoi('loiSua');
  var sttN = soTu($('suaStt').value);
  var klN = klBaoTu($('suaKl').value);   // bản 1.7 — xem klBaoTu

  if (isNaN(sttN) || sttN <= 0 || sttN !== Math.floor(sttN)) {
    hienLoi('loiSua', 'Số bao phải là số nguyên dương.');
    return;
  }
  if (isNaN(klN) || klN < S.cauHinh.KL_MIN || klN > S.cauHinh.KL_MAX) {
    hienLoi('loiSua', 'Khối lượng phải trong khoảng ' +
      S.cauHinh.KL_MIN + '–' + S.cauHinh.KL_MAX + ' kg.');
    return;
  }

  cho(true);
  // Tham số loại đi CUỐI — xem ghi chú ở apiSuaBao trong 04_Api.gs.
  goi('apiSuaBao', [S.ve, S.baoDangSua.id, sttN, klN, $('lyDoBao').value,
                    S.loaiSuaDangChon])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiSua', kq ? kq.error : 'Lỗi'); return; }
      an('lopPhu');
      S.baoDangSua = null;
      toast('Đã sửa', 'xanh');
      taiLaiLo(S.lo.ma_lo, true);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiSua', 'Mất mạng — sửa được khi có mạng trở lại.');
    });
}

function xoaBao() {
  if (!S.baoDangSua) return;
  if (!confirm('XOÁ bao ' + S.baoDangSua.ky_hieu + S.baoDangSua.loai +
               ' — STT ' + S.baoDangSua.stt_bao + ' (' + S.baoDangSua.khoi_luong + ' kg)?\n\n' +
               'Thao tác này được ghi vào nhật ký.')) return;

  cho(true);
  goi('apiXoaBao', [S.ve, S.baoDangSua.id, $('lyDoBao').value])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiSua', kq ? kq.error : 'Lỗi'); return; }
      an('lopPhu');
      S.baoDangSua = null;
      toast('Đã xoá', 'xanh');
      taiLaiLo(S.lo.ma_lo, true);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiSua', 'Mất mạng — xoá được khi có mạng trở lại.');
    });
}

/* ============================================================
   CHỐT CA / ĐÓNG LÔ
   ============================================================ */

/**
 * Chốt chặn dùng chung: còn bao nằm trong khay lỗi thì KHÔNG cho làm những việc
 * "chốt sổ" (chốt ca, đóng lô, xem kết quả). Nếu cho qua, công nhân sẽ chốt một
 * bộ số liệu THIẾU mà tưởng là đủ — rồi chốt ca xong là khoá luôn, hết đường sửa.
 * @return {boolean} true = đang bị chặn
 */
function chanVaoKhayLoi(viec) {
  var k = layKhayLoi();
  if (!k.length) return false;
  toast(k.length + ' bao chưa vào được hệ thống — xử lý xong rồi hãy ' + viec, 'do');
  moKhayLoi();
  return true;
}

/*
 * Bản 1.6: chốt ca dùng hộp thoại có Ô TÍCH, thay cho confirm() của trình duyệt.
 * confirm() trên Android hiện một hộp nhỏ với nút OK rơi đúng chỗ ngón cái vừa bấm —
 * bấm nhầm hai nhịp liên tiếp là khoá mất phần đang nhập dở. Hộp thoại này in rõ
 * lô nào, bao nhiêu bao, bao nhiêu kg trước khi công nhân tích.
 */
function chotCa() {
  if (chanVaoKhayLoi('chốt ca')) return;
  var hd = layHangDoi();
  if (hd.length) {
    toast('Còn ' + hd.length + ' bao chưa gửi — chờ gửi xong rồi chốt', 'do');
    xuLyHangDoi(true);
    return;
  }
  if (!S.lo) { toast('Chưa mở lô nào', 'do'); return; }

  // Đếm phần SẼ BỊ KHOÁ để công nhân thấy con số trước khi tích, không tích mù.
  var soBao = 0, tongKl = 0, toi = String(S.nguoiDung.ma_nv).toUpperCase();
  S.dsBao.forEach(function (b) {
    if (b.trang_thai !== 'DANG_NHAP') return;
    if (String(b.nguoi_nhap || '').toUpperCase() !== toi) return;
    soBao++;
    tongKl += Number(b.khoi_luong) || 0;
  });

  $('maLoChot').textContent = S.lo.ma_lo;
  $('tomTatChotCa').textContent = soBao
    ? (soBao + ' bao của bạn sẽ bị khoá — ' + (Math.round(tongKl * 10) / 10) + ' kg')
    : 'Không thấy bao nào của bạn đang chờ chốt trong lô này.';
  $('tichChotCa').checked = false;
  $('btnXacNhanChot').disabled = true;
  anLoi('loiChotCa');
  hien('lopChotCa');
}

function dongHopChotCa(e) {
  if (e && e.target && e.target.id !== 'lopChotCa') return;
  an('lopChotCa');
}

function doiTichChotCa() {
  var tich = $('tichChotCa').checked;
  $('btnXacNhanChot').disabled = !tich;
  if (tich) anLoi('loiChotCa');
}

function xacNhanChotCa() {
  if (!S.lo) return;
  if (!$('tichChotCa').checked) {
    hienLoi('loiChotCa', 'Hãy tích vào ô xác nhận trước khi bấm CHỐT CA.');
    rung([60, 50, 60]);
    return;
  }

  cho(true);
  // Tham số thứ 4 là cờ xác nhận của bản 1.6 — máy chủ soát lại lần nữa (apiChotCa).
  goi('apiChotCa', [S.ve, S.phien, S.lo.ma_lo, 'XAC_NHAN'])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) { hienLoi('loiChotCa', kq ? kq.error : 'Lỗi'); return; }
      an('lopChotCa');
      S.phien = taoPhienMoi();
      var tb = '✔ Đã chốt ' + kq.data.so_bao + ' bao — ' + kq.data.tong_kl + ' kg';
      if (kq.data.so_bao_lo_khac) {
        tb += ' (+' + kq.data.so_bao_lo_khac + ' bao quá hạn ở lô cũ)';
      }
      toast(tb, 'xanh');
      taiLaiLo(S.lo.ma_lo, true);
    })
    .catch(function () {
      cho(false);
      hienLoi('loiChotCa', 'Mất mạng — chốt ca cần có mạng.');
    });
}

/*
 * Đóng lô là thao tác KHOÁ VĨNH VIỄN, mở lại phải nhờ quản lý.
 * Bản 1.5 bắt gõ lại mã lô; bản 1.6 đổi thành TÍCH Ô (Andy chốt 22/08/2026) vì gõ
 * lại mã trên điện thoại giữa xưởng quá chậm. Bù lại: mã lô in to ngay trên ô tích,
 * và nút ĐÓNG LÔ chỉ sáng sau khi đã tích. Máy chủ soát lại lần nữa (apiDongLo).
 */
function dongLo() {
  if (chanVaoKhayLoi('đóng lô')) return;
  var hd = layHangDoi();
  if (hd.length) {
    toast('Còn ' + hd.length + ' bao chưa gửi — chờ gửi xong rồi đóng lô', 'do');
    xuLyHangDoi(true);
    return;
  }
  if (!S.lo) { toast('Chưa mở lô nào', 'do'); return; }

  var d = S.ketQua;
  $('maLoDong').textContent = S.lo.ma_lo;
  $('tomTatDongLo').textContent = (d && d.ma_lo === S.lo.ma_lo)
    ? ('Lô ' + d.ma_lo + ' — ' + d.tong_so_bao_ra + ' bao ra, ' + d.tong_kl_ra + ' kg' +
       (d.co_kl_vao
          ? ' · bụi + hao hụt ' + phanTram(d.ti_le_hao_hut)
          : ' · CHƯA có khối lượng đầu vào, tỉ lệ thu hồi sẽ để trống'))
    : ('Lô ' + S.lo.ma_lo);
  $('tichDongLo').checked = false;
  $('btnXacNhanDong').disabled = true;
  $('lyDoDongLo').value = '';

  /*
   * Bản 1.8: chỉ QUẢN LÝ mới có đường đóng một lô mình không có bao nào, và phải gõ
   * lý do. Ô này hiện sẵn cho quản lý khi đúng là họ không có bao trong lô — máy chủ
   * mới là nơi bắt buộc (batLyDo_), giao diện chỉ dọn chỗ để gõ.
   */
  var coBaoCuaToi = (S.dsBao || []).some(function (b) {
    return String(b.nguoi_nhap || '').toUpperCase() ===
           String(S.nguoiDung && S.nguoiDung.ma_nv || '').toUpperCase();
  });
  if (S.laQuanLy && (S.dsBao || []).length && !coBaoCuaToi) hien('khuLyDoDongLo');
  else an('khuLyDoDongLo');

  anLoi('loiDongLo');
  hien('lopDongLo');
}

function dongHopDongLo(e) {
  if (e && e.target && e.target.id !== 'lopDongLo') return;
  an('lopDongLo');
}

function doiTichDongLo() {
  var tich = $('tichDongLo').checked;
  $('btnXacNhanDong').disabled = !tich;
  if (tich) anLoi('loiDongLo');
}

function xacNhanDongLo() {
  if (!S.lo) return;
  anLoi('loiDongLo');
  if (!$('tichDongLo').checked) {
    hienLoi('loiDongLo', 'Hãy tích vào ô xác nhận trước khi bấm ĐÓNG LÔ.');
    rung([60, 50, 60]);
    return;
  }

  cho(true);
  goi('apiDongLo', [S.ve, S.lo.ma_lo, 'XAC_NHAN', $('lyDoDongLo').value])
    .then(function (kq) {
      cho(false);
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) {
        // Bản 1.8: quản lý bị đòi lý do thì mở sẵn ô lý do ra cho gõ, đừng bắt mò.
        if (kq && kq.code === 'THIEU_LY_DO') {
          hien('khuLyDoDongLo');
          setTimeout(function () { $('lyDoDongLo').focus(); }, 60);
        }
        hienLoi('loiDongLo', kq ? kq.error : 'Lỗi');
        return;
      }
      an('lopDongLo');
      toast('✔ Đã đóng lô — ' + kq.data.so_bao + ' bao, ' + kq.data.tong_kl + ' kg', 'xanh');
      S.phien = taoPhienMoi();
      veManHinhLo();
    })
    .catch(function () {
      cho(false);
      hienLoi('loiDongLo', 'Mất mạng — đóng lô cần có mạng.');
    });
}

/* ============================================================
   MÀN HÌNH THỐNG KÊ
   ============================================================ */

/*
 * Bộ lọc ngày của bảng tổng hợp (bản 1.6). 0 = xem tất cả.
 * Mặc định 30 ngày: ở nhịp thật khoảng 10 lô/ngày, không lọc thì mỗi lần mở bảng là
 * tải cả năm về máy. Lô ĐANG CHẠY không bao giờ bị lọc mất — máy chủ lo việc đó
 * (xem tinhTongHopLo_ trong 05_Report.gs), giao diện không tự lọc lại lần nữa.
 */
var _locNgay = 30;

/** Ngày đầu của khoảng lọc, dạng yyyy-MM-dd. Rỗng = không lọc. */
function tuNgayLoc() {
  if (!_locNgay) return '';
  var d = new Date();
  d.setDate(d.getDate() - (_locNgay - 1));   // tính CẢ hôm nay
  var m = String(d.getMonth() + 1), ng = String(d.getDate());
  if (m.length < 2) m = '0' + m;
  if (ng.length < 2) ng = '0' + ng;
  return d.getFullYear() + '-' + m + '-' + ng;
}

function capNhatNutLoc() {
  var ds = document.querySelectorAll('#hangLocNgay button');
  for (var i = 0; i < ds.length; i++) {
    if (Number(ds[i].getAttribute('data-ngay')) === _locNgay) ds[i].classList.add('chon');
    else ds[i].classList.remove('chon');
  }
}

function doiLocNgay(n) {
  _locNgay = Number(n) || 0;
  capNhatNutLoc();
  moThongKe();
}

/* Một ô số của bảng: rỗng thì để gạch ngang, đừng hiện "0" cho thứ chưa có. */
function oSo(v) {
  return (v === '' || v === null || v === undefined) ? '—' : escapeHtml(v);
}

/* Bấm một dòng của bảng tổng hợp -> mở CHI TIẾT LÔ. Đây là đường vào mà Andy chốt
   cho quyền quản lý (22/08/2026): sửa thẳng từ bảng theo dõi, không phải đi vòng. */
function moChiTietTuTongHop(i) {
  var r = S.dsTongHop && S.dsTongHop[i];
  if (r) moChiTietLo(r.ma_lo, 'ThongKe');
}

function moThongKe() {
  chuyenManHinh('ThongKe');
  capNhatNutLoc();
  $('bangThongKe').innerHTML = '<p class="ghi-chu-mo">Đang tải…</p>';
  goi('apiTongHopLo', [S.ve, tuNgayLoc(), ''])
    .then(function (kq) {
      if (kiemTraPhien(kq)) return;
      if (!kq || !kq.ok) {
        $('bangThongKe').innerHTML = '<p class="ghi-chu-mo">' + escapeHtml(kq ? kq.error : 'Lỗi') + '</p>';
        return;
      }
      var ds = kq.data.ds;
      if (!ds.length) {
